                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Payment Method</label>
                      <select
                        value={paymentMethod}
                        onChange={e => {
                          const m = e.target.value;
                          setPaymentMethod(m);
                          if (m === 'SPLIT' && (!splitCash || !splitMpesa)) {
                            const half = Math.floor(totalAmount / 2);
                            setSplitCash(String(half));
                            setSplitMpesa(String(totalAmount - half));
                          }
                        }}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-bold focus:outline-none focus:ring-2 focus:ring-blue-500"
                      >
                        <option value="MPESA">M-Pesa Till / Paybill</option>
                        <option value="CASH">Cash at Register</option>
                        <option value="SPLIT">Split (Cash + M-Pesa at the same time)</option>
                        <option value="CARD">Debit / Credit Card</option>
                        <option value="CREDIT">Corporate Account</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">M-Pesa Reference / Receipt Code</label>
                      <input
                        type="text"
                        placeholder="e.g. SDF7842NJK"
                        value={paymentReference}
                        onChange={e => setPaymentReference(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                      />
                    </div>
                  </div>

                  {/* Dynamic Split Breakdown (Cash + M-Pesa) */}
                  {paymentMethod === 'SPLIT' && (
                    <div className="bg-blue-50/70 border border-blue-200 p-4 rounded-2xl space-y-3 mb-4">
                      <div className="flex items-center justify-between text-xs">
                        <span className="font-extrabold text-blue-900 uppercase tracking-wider">Dual Payment Breakdown:</span>
                        <span className="text-blue-700 font-semibold">Total to cover: <strong>KSh {totalAmount.toLocaleString()}</strong></span>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-[11px] font-bold text-slate-700 uppercase mb-1">Cash Paid (KSh) *</label>
                          <input
                            type="number"
                            min="0"
                            max={totalAmount}
                            value={splitCash}
                            onChange={e => {
                              const val = e.target.value;
                              setSplitCash(val);
                              const num = Number(val || 0);
                              setSplitMpesa(String(Math.max(0, totalAmount - num)));
                            }}
                            className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-extrabold text-base focus:ring-2 focus:ring-blue-500 bg-white"
                            placeholder="e.g. 200"
                          />
                        </div>

                        <div>
                          <label className="block text-[11px] font-bold text-slate-700 uppercase mb-1">M-Pesa Paid (KSh) *</label>
                          <input
                            type="number"
                            min="0"
                            max={totalAmount}
                            value={splitMpesa}
                            onChange={e => {
                              const val = e.target.value;
                              setSplitMpesa(val);
                              const num = Number(val || 0);
                              setSplitCash(String(Math.max(0, totalAmount - num)));
                            }}
                            className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-extrabold text-base focus:ring-2 focus:ring-blue-500 bg-white"
                            placeholder="e.g. 200"
                          />
                        </div>
                      </div>

                      <div className="flex items-center justify-between text-xs pt-1 border-t border-blue-200/60">
                        <span className="font-bold text-slate-600">
                          Split Sum: KSh {(Number(splitCash || 0) + Number(splitMpesa || 0)).toLocaleString()}
                        </span>
                        {Number(splitCash || 0) + Number(splitMpesa || 0) === totalAmount ? (
                          <span className="text-emerald-700 font-extrabold flex items-center space-x-1">
                            <span>✓</span>
                            <span>Bill 100% Covered (KSh {splitCash} Cash + KSh {splitMpesa} M-Pesa)</span>
                          </span>
                        ) : (
                          <span className="text-red-600 font-bold">
                            ⚠️ Difference: KSh {Math.abs(totalAmount - (Number(splitCash || 0) + Number(splitMpesa || 0))).toLocaleString()}
                          </span>
                        )}
                      </div>
                    </div>
                  )}
                </>
              )}

              {/* Real-time Calculation Summary Card */}
              <div className="bg-gradient-to-r from-slate-950 via-slate-900 to-slate-800 text-white p-5 rounded-2xl shadow-sm space-y-3">
                <div className="flex items-center justify-between text-sm pb-2 border-b border-slate-800">
                  <span className="text-slate-300">Total Customer Bill:</span>
                  <span className="text-2xl font-extrabold text-emerald-400">KSh {totalAmount.toLocaleString()}</span>
                </div>
                <div className="flex items-center justify-between text-sm pb-2 border-b border-slate-800">
                  <span className="text-slate-300">Total Worker Commissions:</span>
                  <span className="text-lg font-bold text-amber-400">KSh {estimatedCommissions.toLocaleString()}</span>
                </div>
                <div className="flex items-center justify-between text-sm">
                  <span className="text-slate-300">Net Business Profit Margin:</span>
                  <span className="text-xl font-extrabold text-blue-400">KSh {netBusinessRevenue.toLocaleString()}</span>
                </div>
              </div>
            </div>

            <button
              type="submit"
              disabled={submitting}
              className={`w-full text-white font-extrabold py-3.5 rounded-2xl text-base shadow-lg transition disabled:opacity-50 ${
                payLater ? 'bg-amber-500 hover:bg-amber-600' : 'bg-blue-600 hover:bg-blue-700'
              }`}
            >
              {submitting
                ? (payLater ? 'Logging Wash (Pay on Collection)...' : 'Recording & Crediting...')
                : (payLater ? '⏳ Log Car Wash (Customer Pays Later on Collection)' : '✓ Complete Car Wash & Credit Worker Balances')}
            </button>
          </form>
        </div>
      );
    }

    // ==========================================
    // 4. WORKER ATTENDANCE MODULE
    // 4. BAY ATTENDANCE REGISTER
    // ==========================================
    function AttendanceRegister({ showToast }) {
      const [workers, setWorkers] = useState([]);
      const [attendanceMap, setAttendanceMap] = useState({});
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);

      const loadData = () => {
        setLoading(true);
        Promise.all([
          authFetch('/workers/?active_only=true').then(r => r.json()),
          authFetch(`/attendance/?date=${date}`).then(r => r.json())
        ]).then(([wData, aData]) => {
          const wList = Array.isArray(wData) ? wData : wData.results || [];
          setWorkers(wList);

          const aList = Array.isArray(aData) ? aData : aData.results || [];
          const map = {};
          // Default all active to PRESENT if no record
          wList.forEach(w => {
            const found = aList.find(a => a.worker === w.id);
            map[w.id] = found ? found.status : 'PRESENT';
          });
          setAttendanceMap(map);
          setLoading(false);
        }).catch(() => setLoading(false));
      };

      useEffect(() => { loadData(); }, [date]);

      const toggleStatus = (workerId, newStatus) => {
        setAttendanceMap(prev => ({ ...prev, [workerId]: newStatus }));
      };

      const handleSave = async () => {
        setSaving(true);
        try {
          const records = Object.entries(attendanceMap).map(([wId, status]) => ({
            worker_id: Number(wId),
            status
          }));

          const res = await authFetch('/attendance/batch_update/', {
            method: 'POST',
            body: JSON.stringify({ date, records })
          });

          if (res.ok) {
            showToast('Staff attendance saved for ' + date, 'success');
          } else {
            showToast('Failed to save attendance', 'error');
          }
        } catch (e) {
          showToast('Error saving attendance', 'error');
        } finally {
          setSaving(false);
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Staff Daily Attendance</h1>
              <p className="text-sm text-slate-500">Record who reported to work to ensure only active bay staff receive jobs</p>
            </div>
            <div className="flex items-center space-x-3">
              <input
                type="date"
                value={date}
                onChange={e => setDate(e.target.value)}
                className="px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold"
              />
              <button
                onClick={handleSave}
                disabled={saving}
                className="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-xs transition"
              >
                {saving ? 'Saving...' : 'Save Attendance'}
              </button>
            </div>
          </div>

          <div className="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
            <table className="w-full text-left text-sm">
              <thead className="bg-slate-50 text-slate-500 text-xs uppercase font-extrabold tracking-wider border-b border-slate-200">
                <tr>
                  <th className="px-6 py-3.5">Worker Name</th>
                  <th className="px-6 py-3.5">Phone / M-Pesa</th>
                  <th className="px-6 py-3.5">Attendance Status</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {workers.map(w => {
                  const currentStatus = attendanceMap[w.id] || 'PRESENT';
                  return (
                    <tr key={w.id} className="hover:bg-slate-50 transition">
                      <td className="px-6 py-4 font-bold text-slate-900">
                        {w.user.first_name || w.user.username} {w.user.last_name || ''}
                      </td>
                      <td className="px-6 py-4 font-mono text-xs text-slate-500">
                        {w.mpesa_number || w.user.phone_number}
                      </td>
                      <td className="px-6 py-4">
                        <div className="flex items-center space-x-1.5">
                          {[
                            { id: 'PRESENT', label: 'Present on Bay', color: 'bg-emerald-600 text-white' },
                            { id: 'HALF_DAY', label: 'Half Day', color: 'bg-amber-500 text-white' },
                            { id: 'ABSENT', label: 'Absent', color: 'bg-red-500 text-white' },
                          ].map(opt => (
                            <button
                              key={opt.id}
                              onClick={() => toggleStatus(w.id, opt.id)}
                              className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                                currentStatus === opt.id ? opt.color : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                              }`}
                            >
                              {opt.label}
                            </button>
                          ))}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. DAILY CLOSING REGISTER (Cash Drawer & Reconciliation)
    // 5. DAILY CLOSING REGISTER
    // ==========================================
    function DailyClosingRegister({ showToast }) {
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [closingData, setClosingData] = useState(null);
      const [actualCash, setActualCash] = useState('');
      const [notes, setNotes] = useState('');
      const [submitting, setSubmitting] = useState(false);

      const loadClosingPreview = () => {
        authFetch(`/daily-closings/preview/?date=${date}`)
          .then(r => r.json())
          .then(d => {
            setClosingData(d);
            if (d.existing_closing) {
              setActualCash(d.existing_closing.actual_cash_counted);
              setNotes(d.existing_closing.notes || '');
            }
          })
          .catch(() => {});
      };

      useEffect(() => { loadClosingPreview(); }, [date]);

      const handleSaveClosing = async (e) => {
        e.preventDefault();
        setSubmitting(true);
        try {
          const payload = {
            date,
            total_cars_washed: closingData.total_cars_washed,
            total_revenue: closingData.total_revenue,
            total_cash_revenue: closingData.total_cash_revenue,
            total_mpesa_revenue: closingData.total_mpesa_revenue,
            total_commissions: closingData.total_commissions,
            total_payouts: closingData.total_payouts,
            total_expenses: closingData.total_expenses,
            expected_cash_in_drawer: closingData.expected_cash_in_drawer,
            actual_cash_counted: Number(actualCash || 0),
            notes
          };

          const res = await authFetch('/daily-closings/', {
            method: 'POST',
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            showToast('Day closed and register locked successfully!', 'success');
            loadClosingPreview();
          } else {
            showToast('Failed to close day', 'error');
          }
        } catch (e) {
          showToast('Error recording daily closing', 'error');
        } finally {
          setSubmitting(false);
        }
      };

      const variance = Number(actualCash || 0) - (closingData?.expected_cash_in_drawer || 0);

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Daily Cash Closing Register</h1>
              <p className="text-sm text-slate-500">End-of-day register balancing, expected cash vs physical drawer count</p>
            </div>
            <div className="flex flex-wrap items-center gap-2">
              <input
                type="date"
                value={date}
                onChange={e => setDate(e.target.value)}
                className="px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-bold"
              />
              <button
                type="button"
                onClick={() => {
                  const token = safeStore.getItem('cw_token') || '';
                  window.open(`${API_BASE}/reports/export/shift-closing/pdf/?token=${token}&date=${date}`, '_blank');
                  showToast('Downloading Shift Closing PDF Voucher...', 'info');
                }}
                className="px-3 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-extrabold shadow-xs transition flex items-center space-x-1"
                title="Download Shift Closing Statement PDF"
              >
                <span>📕</span><span>Closing PDF</span>
              </button>
              <button
                type="button"
                onClick={() => {
                  const token = safeStore.getItem('cw_token') || '';
                  window.open(`${API_BASE}/reports/export/shift-closing/excel/?token=${token}&date=${date}`, '_blank');
                  showToast('Downloading Shift Register Excel...', 'info');
                }}
                className="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold shadow-xs transition flex items-center space-x-1"
                title="Download Shift Register Excel"
              >
                <span>📗</span><span>Closing Excel</span>
              </button>
            </div>
          </div>

          {closingData?.is_already_closed && (
            <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl flex items-center justify-between text-xs text-emerald-900">
              <div className="flex items-center space-x-2">
                <span>🔒</span>
                <span className="font-extrabold">This day has already been closed and audited by {closingData.existing_closing?.closed_by_name || 'Admin'}!</span>
              </div>
              <span className="font-bold">Variance: KSh {Number(closingData.existing_closing?.cash_variance || 0).toLocaleString()}</span>
            </div>
          )}

          {/* Reconciliation Table */}
          <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-xs space-y-4">
            <h3 className="font-extrabold text-slate-900 text-base">Day's Financial Summary</h3>
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
              <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                <span className="text-slate-400 font-bold uppercase text-[10px]">Cars Washed</span>
                <p className="text-xl font-extrabold text-slate-900 mt-1">{closingData?.total_cars_washed || 0}</p>
              </div>
              <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                <span className="text-slate-400 font-bold uppercase text-[10px]">Total Revenue</span>
                <p className="text-xl font-extrabold text-emerald-600 mt-1">KSh {Number(closingData?.total_revenue || 0).toLocaleString()}</p>
              </div>
              <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                <span className="text-slate-400 font-bold uppercase text-[10px]">M-Pesa Revenue</span>
                <p className="text-xl font-extrabold text-blue-600 mt-1">KSh {Number(closingData?.total_mpesa_revenue || 0).toLocaleString()}</p>
              </div>
              <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-100">
                <span className="text-slate-400 font-bold uppercase text-[10px]">Cash Revenue</span>
                <p className="text-xl font-extrabold text-emerald-700 mt-1">KSh {Number(closingData?.total_cash_revenue || 0).toLocaleString()}</p>
              </div>
            </div>

            <hr className="border-slate-100" />

            <form onSubmit={handleSaveClosing} className="space-y-4 text-xs">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div className="bg-blue-50/50 p-4 rounded-2xl border border-blue-200">
                  <p className="font-bold text-blue-900 uppercase text-[10px]">Expected Cash in Drawer</p>
                  <p className="text-xs text-blue-700 mt-0.5">(Cash Sales - Cash Payouts - Cash Expenses)</p>
                  <h2 className="text-2xl font-extrabold text-blue-900 mt-2">
                    KSh {Number(closingData?.expected_cash_in_drawer || 0).toLocaleString()}
                  </h2>
                </div>

                <div>
                  <label className="block font-bold text-slate-700 uppercase mb-1">Physical Cash Counted *</label>
                  <input
                    type="number"
                    step="0.01"
                    required
                    placeholder="Enter physical cash in drawer"
                    value={actualCash}
                    onChange={e => setActualCash(e.target.value)}
                    className="w-full px-3.5 py-3 rounded-2xl border border-slate-300 font-extrabold text-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                  <div className="mt-2 flex justify-between font-bold">
                    <span>Discrepancy / Variance:</span>
                    <span className={variance === 0 ? 'text-emerald-600' : variance > 0 ? 'text-blue-600' : 'text-red-600'}>
                      KSh {variance.toLocaleString()} {variance === 0 ? '(Balanced)' : variance > 0 ? '(Overage)' : '(Shortage)'}
                    </span>
                  </div>
                </div>
              </div>

              <div>
                <label className="block font-bold text-slate-700 uppercase mb-1">Audit Closing Notes</label>
                <input
                  type="text"
                  placeholder="e.g. Verified by Grace and Cash Handover to Safe"
                  value={notes}
                  onChange={e => setNotes(e.target.value)}
                  className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm"
                />
              </div>

              <button
                type="submit"
                disabled={submitting}
                className="w-full bg-slate-900 hover:bg-black text-white font-extrabold py-3.5 rounded-2xl text-sm shadow-md transition"
              >
                {submitting ? 'Locking Books...' : '🔐 Finalize Daily Register Closing'}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ==========================================
    // 6. APPROVALS QUEUE
    // ==========================================
    function ApprovalsQueue({ showToast, reloadPendingCount }) {
      const [pendingWashes, setPendingWashes] = useState([]);
      const [loading, setLoading] = useState(true);

      const loadPending = () => {
        setLoading(true);
        authFetch('/washes/pending/')
          .then(res => res.json())
          .then(data => {
            setPendingWashes(Array.isArray(data) ? data : []);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      };

      useEffect(() => { loadPending(); }, []);

      const handleApprove = async (id) => {
        try {
          const res = await authFetch(`/washes/${id}/approve/`, { method: 'POST' });
          if (res.ok) {
            showToast('Wash job approved! Worker commission credited to ledger.', 'success');
            loadPending();
            reloadPendingCount();
          } else {
            showToast('Failed to approve wash', 'error');
          }
        } catch (e) {
          showToast('Error approving job', 'error');
        }
      };

      const handleCancel = async (id) => {
        if (!confirm('Reject this job?')) return;
        try {
          const res = await authFetch(`/washes/${id}/cancel/`, { method: 'POST' });
          if (res.ok) {
            showToast('Wash job rejected.', 'info');
            loadPending();
            reloadPendingCount();
          }
        } catch (e) {
          showToast('Error rejecting job', 'error');
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Worker Approvals Queue</h1>

              🔄 Refresh Queue
            </button>

          {loading ? (
            <p className="text-center text-sm text-slate-400 py-10">Checking queue...</p>
          ) : pendingWashes.length === 0 ? (
            <div className="bg-white p-12 text-center rounded-3xl border border-slate-200">
              <span className="text-4xl">🎉</span>
              <h3 className="font-bold text-slate-800 text-lg mt-3">Queue is Clear!</h3>
              <p className="text-sm text-slate-500 mt-1">No pending worker wash submissions awaiting approval.</p>
            </div>
          ) : (
            <div className="space-y-4">
              {pendingWashes.map(cw => (
                <div key={cw.id} className="bg-white p-5 rounded-2xl border border-amber-200 shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div className="space-y-2">
                    <div className="flex items-center space-x-2">
                      <span className="bg-amber-100 text-amber-800 text-xs font-bold px-2.5 py-0.5 rounded-md">Pending Review</span>
                      <span className="text-xs text-slate-400">Bay {cw.bay_number || 1} • Logged by {cw.logged_by_name || 'Worker'}</span>
                    </div>
                    <div className="flex items-baseline space-x-3">
                      <h3 className="text-xl font-extrabold text-slate-900 font-mono tracking-wider">{cw.vehicle.plate_number}</h3>
                      <span className="text-xs text-slate-500">{cw.vehicle.make_model || cw.vehicle.vehicle_type}</span>
                    </div>

                    <div className="flex flex-wrap gap-2 text-xs">
                      {cw.services?.map(s => (
                        <span key={s.id} className="bg-slate-100 text-slate-700 px-2 py-1 rounded-md font-medium">
                          {s.service_name_snapshot} (KSh {s.price_charged}) 
                          {s.assignments?.map(a => ` → ${a.worker_name}: KSh ${a.commission_earned}`)}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="flex items-center space-x-6 border-t md:border-t-0 pt-3 md:pt-0">
                    <div className="text-right">
                      <p className="text-xs text-slate-400">Customer Bill</p>
                      <p className="text-lg font-extrabold text-slate-900">KSh {cw.total_amount}</p>
                      <p className="text-xs text-amber-600 font-bold">Commission: KSh {cw.total_commission}</p>
                    </div>

                    <div className="flex items-center space-x-2">
                      <button
                        onClick={() => handleApprove(cw.id)}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-4 py-2 rounded-xl text-xs shadow-xs transition"
                      >

          )}

    // ==========================================
    // 8. CAR WASH TRANSACTIONS LOG
    // ==========================================
    function CarWashesList({ showToast }) {
      const [washes, setWashes] = useState([]);
      const [searchPlate, setSearchPlate] = useState('');
      const [filterMode, setFilterMode] = useState('ALL'); // 'ALL' | 'UNPAID' | 'PAID'
      const [loading, setLoading] = useState(true);

      // Collect Payment Modal state
      const [collectModalOpen, setCollectModalOpen] = useState(false);
      const [collectingWash, setCollectingWash] = useState(null);
      const [collectPaymentMethod, setCollectPaymentMethod] = useState('MPESA');
      const [collectRef, setCollectRef] = useState('');
      const [collectSplitCash, setCollectSplitCash] = useState('');
      const [collectSplitMpesa, setCollectSplitMpesa] = useState('');
      const [collectCashTendered, setCollectCashTendered] = useState('');
      const [submittingCollection, setSubmittingCollection] = useState(false);

      const loadWashes = () => {
        setLoading(true);
        const query = searchPlate ? `?plate=${searchPlate}` : '';
        authFetch(`/washes/${query}`)
          .then(res => res.json())
          .then(data => {
            setWashes(Array.isArray(data) ? data : data.results || []);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      };

      useEffect(() => { loadWashes(); }, [searchPlate]);

      const handlePrintReceipt = (id) => {
        const token = safeStore.getItem('cw_token');
        window.open(`${API_BASE}/washes/${id}/receipt/?token=${token}`, '_blank');
      };

      const handleOpenCollect = (wash) => {
        setCollectingWash(wash);
        setCollectPaymentMethod('MPESA');
        setCollectRef('');
        const amt = Number(wash.total_amount || 0);
        const half = Math.floor(amt / 2);
        setCollectSplitCash(String(half));
        setCollectSplitMpesa(String(amt - half));
        setCollectCashTendered('');
        setCollectModalOpen(true);
      };

      const handleConfirmCollect = async (e) => {
        e.preventDefault();
        if (!collectingWash) return;

        const total = Number(collectingWash.total_amount || 0);

        if (collectPaymentMethod === 'SPLIT') {
          const c = Number(collectSplitCash || 0);
          const m = Number(collectSplitMpesa || 0);
          if (c + m !== total) {
            if (showToast) showToast(`Split amounts (Cash: KSh ${c} + M-Pesa: KSh ${m}) must equal total KSh ${total}`, 'error');
            return;
          }
        }

        setSubmittingCollection(true);
        try {
          const payload = {
            payment_method: collectPaymentMethod,
            cash_amount: collectPaymentMethod === 'CASH' ? total : collectPaymentMethod === 'SPLIT' ? Number(collectSplitCash || 0) : 0,
            mpesa_amount: collectPaymentMethod === 'MPESA' ? total : collectPaymentMethod === 'SPLIT' ? Number(collectSplitMpesa || 0) : 0,
            payment_reference: collectRef.trim()
          };

          const res = await authFetch(`/washes/${collectingWash.id}/collect_payment/`, {
            method: 'POST',
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            if (showToast) showToast(`Payment of KSh ${total.toLocaleString()} collected for ${collectingWash.vehicle.plate_number}! Bill marked as settled.`, 'success');
            setWashes(prev => prev.map(w => {
              if (w.id === collectingWash.id) {
                return {
                  ...w,
                  is_paid: true,
                  payment_method: collectPaymentMethod,
                  payment_reference: collectRef.trim(),
                  cash_amount: payload.cash_amount,
                  mpesa_amount: payload.mpesa_amount
                };
              }
              return w;
            }));
            setCollectModalOpen(false);
            setCollectingWash(null);
          } else {
            const err = await res.json();
            if (showToast) showToast(err.error || 'Failed to collect payment', 'error');
          }
        } catch (err) {
          if (showToast) showToast('Error collecting payment', 'error');
        } finally {
          setSubmittingCollection(false);
        }
      };

      // Filtered washes
      const unpaidCount = washes.filter(w => !w.is_paid || w.payment_method === 'UNPAID').length;
      const paidCount = washes.filter(w => w.is_paid && w.payment_method !== 'UNPAID').length;

      const filteredWashes = washes.filter(w => {
        const isUnpaid = !w.is_paid || w.payment_method === 'UNPAID';
        if (filterMode === 'UNPAID') return isUnpaid;
        if (filterMode === 'PAID') return !isUnpaid;
        return true;
      });

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Car Wash Transactions Log</h1>
              <p className="text-sm text-slate-500">Record of washes, payment statuses, and vehicle collection collection points</p>
            </div>
            <div className="w-full sm:w-64">
              <input
                type="text"
                placeholder="Search plate (e.g. KDA)..."
                value={searchPlate}
                onChange={e => setSearchPlate(e.target.value)}
                className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500"
              />
            </div>
          </div>

          {/* Filter Tabs: All vs Ready for Pickup/Unpaid vs Paid */}
          <div className="flex items-center space-x-2 border-b border-slate-200 pb-2">
            <button
              onClick={() => setFilterMode('ALL')}
              className={`px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center space-x-1.5 ${
                filterMode === 'ALL'
                  ? 'bg-blue-600 text-white shadow-xs'
                  : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
              }`}
            >
              <span>All Washes</span>
              <span className={`px-1.5 py-0.5 rounded-full text-[10px] ${filterMode === 'ALL' ? 'bg-blue-700 text-white' : 'bg-slate-100 text-slate-600'}`}>
                {washes.length}
              </span>
            </button>

            <button
              onClick={() => setFilterMode('UNPAID')}
              className={`px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center space-x-1.5 ${
                filterMode === 'UNPAID'
                  ? 'bg-amber-500 text-white shadow-xs'
                  : 'bg-white text-amber-800 hover:bg-amber-50 border border-amber-200'
              }`}
            >
              <span>⏳ Pay on Collection / Unpaid</span>
              <span className={`px-1.5 py-0.5 rounded-full text-[10px] font-extrabold ${filterMode === 'UNPAID' ? 'bg-amber-600 text-white' : 'bg-amber-100 text-amber-900'}`}>
                {unpaidCount}
              </span>
            </button>

            <button
              onClick={() => setFilterMode('PAID')}
              className={`px-4 py-2 rounded-xl text-xs font-extrabold transition flex items-center space-x-1.5 ${
                filterMode === 'PAID'
                  ? 'bg-emerald-600 text-white shadow-xs'
                  : 'bg-white text-emerald-800 hover:bg-emerald-50 border border-emerald-200'
              }`}
            >
              <span>✅ Paid & Settled</span>
              <span className={`px-1.5 py-0.5 rounded-full text-[10px] font-extrabold ${filterMode === 'PAID' ? 'bg-emerald-700 text-white' : 'bg-emerald-100 text-emerald-900'}`}>
                {paidCount}
              </span>
            </button>
          </div>

          {/* Washes Table */}
          <div className="bg-white rounded-3xl border border-slate-200 shadow-xs overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm">
                <thead className="bg-slate-50 text-slate-500 text-xs uppercase font-extrabold tracking-wider border-b border-slate-200">
                  <tr>
                    <th className="px-6 py-3.5">Plate Number</th>
                    <th className="px-6 py-3.5">Date & Time</th>
                    <th className="px-6 py-3.5">Services & Assigned Workers</th>
                    <th className="px-6 py-3.5 text-right">Customer Bill</th>
                    <th className="px-6 py-3.5 text-center">Payment Status</th>
                    <th className="px-6 py-3.5 text-center">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {loading ? (
                    <tr><td colSpan="6" className="text-center py-8 text-slate-400">Loading washes...</td></tr>
                  ) : filteredWashes.length === 0 ? (
                    <tr>
                      <td colSpan="6" className="text-center py-10 text-slate-400">
                        {filterMode === 'UNPAID' ? '🎉 No vehicles awaiting payment! All cars are settled.' : 'No washes found'}
                      </td>
                    </tr>
                  ) : filteredWashes.map(w => {
                    const isUnpaid = !w.is_paid || w.payment_method === 'UNPAID';
                    return (
                      <tr key={w.id} className={`hover:bg-slate-50/70 transition ${isUnpaid ? 'bg-amber-50/30' : ''}`}>
                        <td className="px-6 py-4">
                          <div className="flex items-center space-x-2">
                            <span className="font-extrabold text-slate-900 tracking-wider font-mono text-sm">{w.vehicle.plate_number}</span>
                            {isUnpaid && (
                              <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse" title="Awaiting Payment"></span>
                            )}
                          </div>
                          <p className="text-xs text-slate-400">{w.vehicle.make_model || w.vehicle.vehicle_type}</p>
                          {w.vehicle.customer_name && (
                            <p className="text-[11px] text-slate-500">
                              👤 {w.vehicle.customer_name} {w.vehicle.customer_phone ? `(${w.vehicle.customer_phone})` : ''}
                            </p>
                          )}
                        </td>

                        <td className="px-6 py-4 text-xs text-slate-500">
                          {new Date(w.created_at).toLocaleString()}
                          <p className="text-[11px] font-semibold text-slate-400 mt-0.5">
                            Bay {w.bay_number || 1} • {w.status}
                          </p>
                        </td>

                        <td className="px-6 py-4">
                          <div className="space-y-1">
                            {w.services?.map(s => (
                              <div key={s.id} className="text-xs text-slate-700">
                                <span className="font-bold text-slate-900">{s.service_name_snapshot}</span>
                                <span className="text-slate-400 ml-1.5">(KSh {s.price_charged}):</span>
                                {s.assignments?.map(a => (
                                  <span key={a.id} className="ml-1.5 text-blue-700 font-bold">
                                    {a.worker_name} [KSh {a.commission_earned}]
                                  </span>
                                ))}
                              </div>
                            ))}
                          </div>
                        </td>

                        <td className="px-6 py-4 text-right">
                          <p className="font-extrabold text-base text-slate-900">
                            KSh {Number(w.total_amount).toLocaleString()}
                          </p>
                          <p className="text-[11px] font-bold text-amber-600">
                            Comm: KSh {Number(w.total_commission).toLocaleString()}
                          </p>
                        </td>

                        <td className="px-6 py-4 text-center">
                          {isUnpaid ? (
                            <div className="inline-flex flex-col items-center">
                              <span className="px-2.5 py-1 rounded-full text-[11px] font-extrabold bg-amber-100 text-amber-900 border border-amber-300">
                                ⏳ UNPAID (Pay on Collection)
                              </span>
                              <span className="text-[10px] text-amber-700 font-semibold mt-0.5">
                                Awaiting Owner Pickup
                              </span>
                            </div>
                          ) : (
                            <div className="inline-flex flex-col items-center">
                              <span className="px-2.5 py-1 rounded-full text-[11px] font-extrabold bg-emerald-100 text-emerald-800">
                                ✅ PAID ({w.payment_method})
                              </span>
                              {w.payment_method === 'SPLIT' ? (
                                <span className="text-[10px] text-blue-700 font-bold mt-0.5">
                                  Cash: KSh {Number(w.cash_amount || 0).toLocaleString()} + M-Pesa: KSh {Number(w.mpesa_amount || 0).toLocaleString()}
                                </span>
                              ) : (
                                w.payment_reference && (
                                  <span className="text-[10px] text-slate-400 font-mono mt-0.5">
                                    {w.payment_reference}
                                  </span>
                                )
                              )}
                            </div>
                          )}
                        </td>

                        <td className="px-6 py-4 text-center">
                          {isUnpaid ? (
                            <button
                              onClick={() => handleOpenCollect(w)}
                              className="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-extrabold shadow-md transition flex items-center justify-center space-x-1.5 mx-auto"
                            >
                              <span>💰</span>
                              <span>Collect Payment</span>
                            </button>
                          ) : (
                            <button
                              onClick={() => handlePrintReceipt(w.id)}
                              title="Download Customer Thermal Receipt"
                              className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition inline-flex items-center space-x-1"
                            >
                              <span>📄</span>
                              <span>Receipt</span>
                            </button>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Collect Payment Modal */}
          {collectModalOpen && collectingWash && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 text-xs">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center space-x-2.5">
                    <div className="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center text-lg font-bold">
                      💰
                    </div>
                    <div>
                      <h3 className="font-extrabold text-base text-slate-900">Collect & Settle Payment</h3>
                      <p className="text-slate-400 font-mono font-bold text-xs">
                        Vehicle: {collectingWash.vehicle.plate_number}
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => { setCollectModalOpen(false); setCollectingWash(null); }}
                    className="text-slate-400 hover:text-slate-600 text-base"
                  >
                    ✕
                  </button>
                </div>

                {/* Customer and Bill Overview Card */}
                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2">
                  <div className="flex justify-between items-center text-xs">
                    <span className="text-slate-500">Customer:</span>
                    <span className="font-bold text-slate-800">
                      {collectingWash.vehicle.customer_name || 'Walk-in Client'}
                      {collectingWash.vehicle.customer_phone ? ` (${collectingWash.vehicle.customer_phone})` : ''}
                    </span>
                  </div>
                  <div className="flex justify-between items-center text-xs">
                    <span className="text-slate-500">Vehicle Type:</span>
                    <span className="font-semibold text-slate-700">
                      {collectingWash.vehicle.make_model ? `${collectingWash.vehicle.make_model} • ` : ''}{collectingWash.vehicle.vehicle_type}
                    </span>
                  </div>
                  <div className="pt-2 border-t border-slate-200 flex justify-between items-center">
                    <span className="font-extrabold text-sm text-slate-700">Total Bill Due:</span>
                    <span className="text-2xl font-extrabold text-emerald-600">
                      KSh {Number(collectingWash.total_amount).toLocaleString()}
                    </span>
                  </div>
                </div>

                <form onSubmit={handleConfirmCollect} className="space-y-3.5">
                  <div>
                    <label className="block font-bold text-slate-700 uppercase tracking-wider mb-1">
                      Customer Paid By What Means? *
                    </label>
                    <select
                      value={collectPaymentMethod}
                      onChange={e => {
                        const m = e.target.value;
                        setCollectPaymentMethod(m);
                        if (m === 'SPLIT' && (!collectSplitCash || !collectSplitMpesa)) {
                          const tot = Number(collectingWash.total_amount || 0);
                          const half = Math.floor(tot / 2);
                          setCollectSplitCash(String(half));
                          setCollectSplitMpesa(String(tot - half));
                        }
                      }}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-extrabold text-sm focus:ring-2 focus:ring-emerald-500 bg-white"
                    >
                      <option value="MPESA">M-Pesa Till / Paybill</option>
                      <option value="CASH">Cash at Register</option>
                      <option value="SPLIT">Split (Cash + M-Pesa)</option>
                      <option value="CARD">Debit / Credit Card</option>
                      <option value="CREDIT">Corporate / Account</option>
                    </select>
                  </div>

                  {/* M-PESA Code Input */}
                  {collectPaymentMethod === 'MPESA' && (
                    <div>
                      <label className="block font-bold text-slate-700 uppercase tracking-wider mb-1">
                        M-Pesa Confirmation Code *
                      </label>
                      <input
                        type="text"
                        required
                        placeholder="e.g. SLK89271KJ"
                        value={collectRef}
                        onChange={e => setCollectRef(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-mono font-bold uppercase text-sm focus:ring-2 focus:ring-emerald-500"
                      />
                    </div>
                  )}

                  {/* CASH Payment with Change Calculator */}
                  {collectPaymentMethod === 'CASH' && (
                    <div className="space-y-2 bg-emerald-50/50 p-3.5 rounded-2xl border border-emerald-200">
                      <div>
                        <label className="block font-bold text-slate-700 uppercase tracking-wider mb-1 text-[11px]">
                          Cash Tendered by Customer (Optional)
                        </label>
                        <input
                          type="number"
                          placeholder={`e.g. ${Math.ceil(Number(collectingWash.total_amount) / 500) * 500}`}
                          value={collectCashTendered}
                          onChange={e => setCollectCashTendered(e.target.value)}
                          className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm font-bold bg-white"
                        />
                      </div>
                      {collectCashTendered && Number(collectCashTendered) >= Number(collectingWash.total_amount) && (
                        <div className="flex justify-between items-center text-xs pt-1 border-t border-emerald-200">
                          <span className="font-bold text-emerald-900">Change Due to Customer:</span>
                          <span className="text-base font-extrabold text-emerald-700">
                            KSh {(Number(collectCashTendered) - Number(collectingWash.total_amount)).toLocaleString()}
                          </span>
                        </div>
                      )}
                    </div>
                  )}

                  {/* SPLIT Payment */}
                  {collectPaymentMethod === 'SPLIT' && (
                    <div className="bg-blue-50/70 border border-blue-200 p-3.5 rounded-2xl space-y-2.5">
                      <div className="flex justify-between text-xs font-bold text-blue-900">
                        <span>Dual Split:</span>
                        <span>Total: KSh {Number(collectingWash.total_amount).toLocaleString()}</span>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[10px] font-bold text-slate-600 uppercase mb-0.5">Cash (KSh)</label>
                          <input
                            type="number"
                            value={collectSplitCash}
                            onChange={e => {
                              const val = e.target.value;
                              setCollectSplitCash(val);
                              const tot = Number(collectingWash.total_amount || 0);
                              setCollectSplitMpesa(String(Math.max(0, tot - Number(val || 0))));
                            }}
                            className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-extrabold bg-white"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] font-bold text-slate-600 uppercase mb-0.5">M-Pesa (KSh)</label>
                          <input
                            type="number"
                            value={collectSplitMpesa}
                            onChange={e => {
                              const val = e.target.value;
                              setCollectSplitMpesa(val);
                              const tot = Number(collectingWash.total_amount || 0);
                              setCollectSplitCash(String(Math.max(0, tot - Number(val || 0))));
                            }}
                            className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-extrabold bg-white"
                          />
                        </div>
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-slate-600 uppercase mb-0.5">M-Pesa Reference</label>
                        <input
                          type="text"
                          placeholder="e.g. SLK89271KJ"
                          value={collectRef}
                          onChange={e => setCollectRef(e.target.value)}
                          className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-mono font-bold uppercase bg-white"
                        />
                      </div>
                    </div>
                  )}

                  {collectPaymentMethod === 'CARD' && (
                    <div>
                      <label className="block font-bold text-slate-700 uppercase tracking-wider mb-1">
                        POS Authorization / Slip Number
                      </label>
                      <input
                        type="text"
                        placeholder="e.g. POS-98214"
                        value={collectRef}
                        onChange={e => setCollectRef(e.target.value)}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-mono text-sm"
                      />
                    </div>
                  )}

                  <div className="pt-2 flex items-center space-x-2">
                    <button
                      type="button"
                      onClick={() => { setCollectModalOpen(false); setCollectingWash(null); }}
                      className="w-1/3 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-bold hover:bg-slate-50 transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={submittingCollection}
                      className="w-2/3 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold shadow-md transition disabled:opacity-50"
                    >
                      {submittingCollection ? 'Updating...' : '✓ Settle & Mark as Paid'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 9. SERVICES & RATES CONFIGURATION
    // ==========================================
    function ServicesManagement({ showToast }) {
      const [services, setServices] = useState([]);
      const [statusFilter, setStatusFilter] = useState('all'); // 'all' | 'active' | 'inactive'
      const [createModalOpen, setCreateModalOpen] = useState(false);
      const [editModalOpen, setEditModalOpen] = useState(false);
      const [editingService, setEditingService] = useState(null);
      const [newService, setNewService] = useState({
        name: '',
        description: '',
        default_price: '',
        default_commission_type: 'FIXED',
        default_commission_value: '',
        estimated_minutes: 20,
        is_active: true
      });

      const loadServices = () => {
        authFetch('/services/')
          .then(res => res.json())
          .then(data => setServices(Array.isArray(data) ? data : data.results || []))
          .catch(() => showToast('Failed to load services', 'error'));
      };

      useEffect(() => { loadServices(); }, []);

      const handleCreateService = async (e) => {
        e.preventDefault();
        try {
          const res = await authFetch('/services/', {
            method: 'POST',
            body: JSON.stringify(newService)
          });
          if (res.ok) {
            showToast('Service package added successfully!', 'success');
            setCreateModalOpen(false);
            setNewService({
              name: '',
              description: '',
              default_price: '',
              default_commission_type: 'FIXED',
              default_commission_value: '',
              estimated_minutes: 20,
              is_active: true
            });
            loadServices();
          } else {
            const err = await res.json().catch(() => ({}));
            showToast(err.error || 'Failed to create service', 'error');
          }
        } catch (e) {
          showToast('Error creating service', 'error');
        }
      };

      const handleOpenEdit = (s) => {
        setEditingService({
          id: s.id,
          name: s.name,
          description: s.description || '',
          default_price: s.default_price,
          default_commission_type: s.default_commission_type || 'FIXED',
          default_commission_value: s.default_commission_value,
          estimated_minutes: s.estimated_minutes || 20,
          is_active: s.is_active !== false
        });
        setEditModalOpen(true);
      };

      const handleUpdateService = async (e) => {
        e.preventDefault();
        if (!editingService) return;
        try {
          const res = await authFetch(`/services/${editingService.id}/`, {
            method: 'PATCH',
            body: JSON.stringify(editingService)
          });
          if (res.ok) {
            showToast(`Service "${editingService.name}" updated successfully!`, 'success');
            setEditModalOpen(false);
            setEditingService(null);
            loadServices();
          } else {
            const err = await res.json().catch(() => ({}));
            showToast(err.error || 'Failed to update service', 'error');
          }
        } catch (err) {
          showToast('Network error updating service', 'error');
        }
      };

      const handleDeleteService = async (s) => {
        const confirmMsg = `Delete service "${s.name}"?\n\n- If this service has past customer washes, it will be safely deactivated so your historical revenue & customer receipts stay 100% accurate.\n- If no washes are linked, it will be deleted permanently.`;
        if (!window.confirm(confirmMsg)) return;

        try {
          const res = await authFetch(`/services/${s.id}/`, {
            method: 'DELETE'
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            showToast(data.message || `Service "${s.name}" deleted / deactivated successfully!`, 'success');
            loadServices();
          } else {
            showToast(data.error || 'Failed to delete service', 'error');
          }
        } catch (err) {
          showToast('Network error deleting service', 'error');
        }
      };

      const handleToggleStatus = async (s) => {
        const newStatus = !s.is_active;
        try {
          const res = await authFetch(`/services/${s.id}/`, {
            method: 'PATCH',
            body: JSON.stringify({ is_active: newStatus })
          });
          if (res.ok) {
            showToast(`Service "${s.name}" is now ${newStatus ? 'Active' : 'Deactivated'}`, 'info');
            loadServices();
          }
        } catch (err) {
          showToast('Failed to toggle status', 'error');
        }
      };

      const filteredServices = services.filter(s => {
        if (statusFilter === 'active') return s.is_active !== false;
        if (statusFilter === 'inactive') return s.is_active === false;
        return true;
      });

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Services & Commission Rates</h1>
              <p className="text-sm text-slate-500">Configure prices charged to customers, edit rates, and manage active service offerings</p>
            </div>
            <div className="flex items-center space-x-2">
              <button
                onClick={() => setCreateModalOpen(true)}
                className="bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-4 py-2.5 rounded-xl text-xs shadow-xs transition flex items-center space-x-1.5"
              >
                <span>+</span>
                <span>Add New Service</span>
              </button>
            </div>
          </div>

          {/* Filter Pills */}
          <div className="flex items-center space-x-2 text-xs font-bold">
            <button
              onClick={() => setStatusFilter('all')}
              className={`px-3 py-1.5 rounded-xl transition ${statusFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200'}`}
            >
              All Packages ({services.length})
            </button>
            <button
              onClick={() => setStatusFilter('active')}
              className={`px-3 py-1.5 rounded-xl transition ${statusFilter === 'active' ? 'bg-emerald-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`}
            >
              Active ({services.filter(s => s.is_active !== false).length})
            </button>
            <button
              onClick={() => setStatusFilter('inactive')}
              className={`px-3 py-1.5 rounded-xl transition ${statusFilter === 'inactive' ? 'bg-slate-600 text-white' : 'bg-white text-slate-600 border border-slate-200'}`}
            >
              Deactivated ({services.filter(s => s.is_active === false).length})
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {filteredServices.length === 0 ? (
              <div className="col-span-full bg-white p-12 text-center rounded-3xl border border-slate-200 text-slate-400">
                <p className="text-3xl mb-2">🚗</p>
                <p className="font-bold text-sm">No services found in this view.</p>
                <button
                  onClick={() => setCreateModalOpen(true)}
                  className="mt-3 text-xs font-extrabold text-blue-600 hover:underline"
                >
                  + Add First Service Package
                </button>
              </div>
            ) : (
              filteredServices.map(s => {
                const isActive = s.is_active !== false;
                const netRevenue = s.default_commission_type === 'PERCENTAGE'
                  ? (Number(s.default_price) - (Number(s.default_price) * Number(s.default_commission_value) / 100))
                  : (Number(s.default_price) - Number(s.default_commission_value));

                return (
                  <div
                    key={s.id}
                    className={`bg-white p-5 rounded-2xl border transition shadow-xs flex flex-col justify-between space-y-4 ${
                      isActive ? 'border-slate-200' : 'border-slate-300 opacity-75 bg-slate-50/50'
                    }`}
                  >
                    <div>
                      <div className="flex items-start justify-between">
                        <div>
                          <h3 className="font-extrabold text-base text-slate-900 leading-tight">{s.name}</h3>

                  <div>
                    <label className="block font-bold text-slate-700 uppercase mb-1">Service Name *</label>

                      placeholder="e.g. Ceramic Wax Polish"

                    <div>

                      <input

                  <div className="flex items-center space-x-3 pt-2">

                      Save Service
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Edit Service Modal */}
          {editModalOpen && editingService && (
            <div className="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 text-xs animate-in zoom-in-95 duration-150">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center space-x-2">
                    <span className="text-lg">✏️</span>
                    <h3 className="font-extrabold text-lg text-slate-900">Edit Service Package</h3>
                  </div>
                  <button onClick={() => setEditModalOpen(false)} className="text-slate-400 hover:text-slate-600 font-bold text-sm">✕</button>
                </div>

                <form onSubmit={handleUpdateService} className="space-y-4">
                  <div>
                    <label className="block font-bold text-slate-700 uppercase mb-1">Service Name *</label>
                    <input
                      type="text"
                      required
                      value={editingService.name}
                      onChange={e => setEditingService({ ...editingService, name: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold"
                    />

                  <div>
                    <label className="block font-bold text-slate-700 uppercase mb-1">Customer Price (KSh) *</label>
                    <input
                      type="number"
                      required
                      min="0"
                      value={editingService.default_price}
                      onChange={e => setEditingService({ ...editingService, default_price: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-bold"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Commission Type</label>
                      <select
                        value={editingService.default_commission_type}
                        onChange={e => setEditingService({ ...editingService, default_commission_type: e.target.value })}
                        className="w-full px-3 py-2.5 rounded-xl border border-slate-300 font-bold bg-white"
                      >
                        <option value="FIXED">Fixed Amount (KSh)</option>
                        <option value="PERCENTAGE">Percentage (%)</option>
                      </select>
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 uppercase mb-1">Commission Value *</label>
                      <input
                        type="number"
                        required
                        min="0"
                        value={editingService.default_commission_value}
                        onChange={e => setEditingService({ ...editingService, default_commission_value: e.target.value })}
                        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-bold text-sm"
                      />

                  <div>
                    <label className="block font-bold text-slate-700 uppercase mb-1">Estimated Duration (Minutes)</label>
