<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shell Car Wash | Management & Worker Commission System</title>
  
  <!-- PWA Manifest & Offline Config -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Shell Clean">

  <!-- Tailwind CSS & Inter Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React & Babel for in-browser JSX -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    // Register Service Worker for true offline PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          console.log('[Shell PWA] Service Worker active with scope:', reg.scope);
        }).catch((err) => {
          console.warn('[Shell PWA] Service Worker registration failed:', err);
        });
      });
    }

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
            },
            accent: {
              500: '#f97316',
              600: '#ea580c',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Safe Storage Helper (resilient against browser tracking prevention / blocked storage)
    const safeStore = (() => {
      const memory = {};
      return {
        getItem: (k) => {
          try { return window.localStorage ? window.localStorage.getItem(k) : memory[k]; }
          catch (e) { return memory[k] || null; }
        },
        setItem: (k, v) => {
          try { if (window.localStorage) window.localStorage.setItem(k, v); }
          catch (e) {}
          memory[k] = String(v);
        },
        removeItem: (k) => {
          try { if (window.localStorage) window.localStorage.removeItem(k); }
          catch (e) {}
          delete memory[k];
        }
      };
    })();

    // ==========================================
    // OFFLINE & AUTO-SYNC ENGINE
    // ==========================================
    const offlineEngine = (() => {
      const QUEUE_KEY = 'cw_offline_sync_queue';
      const CACHE_PREFIX = 'cw_offline_cache_';
      const listeners = [];

      const getQueue = () => {
        try {
          const raw = safeStore.getItem(QUEUE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (e) {
          return [];
        }
      };

      const saveQueue = (queue) => {
        safeStore.setItem(QUEUE_KEY, JSON.stringify(queue));
        notifyListeners();
      };

      const enqueue = (item) => {
        const queue = getQueue();
        const queuedItem = {
          id: 'queue_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
          timestamp: new Date().toISOString(),
          endpoint: item.endpoint,
          method: item.method || 'POST',
          body: item.body,
          description: item.description || `${item.method || 'POST'} ${item.endpoint}`
        };
        queue.push(queuedItem);
        saveQueue(queue);
        return queuedItem;
      };

      const dequeue = (id) => {
        const queue = getQueue().filter(q => q.id !== id);
        saveQueue(queue);
      };

      const clearQueue = () => {
        saveQueue([]);
      };

      const getCached = (endpoint) => {
        try {
          const raw = safeStore.getItem(CACHE_PREFIX + endpoint);
          return raw ? JSON.parse(raw) : null;
        } catch (e) {
          return null;
        }
      };

      const setCached = (endpoint, data) => {
        try {
          safeStore.setItem(CACHE_PREFIX + endpoint, JSON.stringify(data));
        } catch (e) {}
      };

      const subscribe = (fn) => {
        listeners.push(fn);
        return () => {
          const idx = listeners.indexOf(fn);
          if (idx !== -1) listeners.splice(idx, 1);
        };
      };

      const notifyListeners = () => {
        const q = getQueue();
        listeners.forEach(fn => {
          try { fn(q); } catch (e) {}
        });
      };

      return {
        getQueue,
        enqueue,
        dequeue,
        clearQueue,
        getCached,
        setCached,
        subscribe,
        notifyListeners
      };
    })();

    // Synthesizes optimistic responses when offline and updates local cache
    const handleOptimisticOfflineMutation = (endpoint, method, bodyData, queueId) => {
      const cleanPath = endpoint.split('?')[0];

      // Collect payment upon vehicle collection
      if (cleanPath.includes('/collect_payment/') && method === 'POST') {
        const parts = cleanPath.split('/');
        const washId = parts[parts.indexOf('washes') + 1];
        const cached = offlineEngine.getCached('/washes/') || [];
        if (Array.isArray(cached)) {
          const updated = cached.map(w => {
            if (String(w.id) === String(washId)) {
              const m = bodyData?.payment_method || 'CASH';
              return {
                ...w,
                is_paid: true,
                payment_method: m,
                payment_reference: bodyData?.payment_reference || '',
                cash_amount: m === 'CASH' ? w.total_amount : Number(bodyData?.cash_amount || 0),
                mpesa_amount: m === 'MPESA' ? w.total_amount : Number(bodyData?.mpesa_amount || 0)
              };
            }
            return w;
          });
          offlineEngine.setCached('/washes/', updated);
        }
        return { status: 'collected', offline_queue_id: queueId };
      }

      // Washes creation
      if (cleanPath.startsWith('/washes/') && method === 'POST') {
        const washId = 'OFFLINE-' + Date.now();
        const isUnpaid = bodyData?.payment_method === 'UNPAID' || bodyData?.is_paid === false;
        const syntheticWash = {
          id: washId,
          created_at: new Date().toISOString(),
          vehicle: {
            plate_number: (bodyData?.plate_number || 'VEHICLE').toUpperCase(),
            vehicle_type: bodyData?.vehicle_type || 'SEDAN',
            customer_name: bodyData?.customer_name || '',
            customer_phone: bodyData?.customer_phone || ''
          },
          status: bodyData?.status || (bodyData?.is_approved ? 'COMPLETED' : 'PENDING'),
          bay_number: bodyData?.bay_number || 1,
          total_amount: Number(bodyData?.total_amount || 0),
          cash_amount: isUnpaid ? 0 : Number(bodyData?.cash_amount || 0),
          mpesa_amount: isUnpaid ? 0 : Number(bodyData?.mpesa_amount || 0),
          total_commission: Number(bodyData?.total_commission || 0),
          net_business_revenue: Number(bodyData?.total_amount || 0) - Number(bodyData?.total_commission || 0),
          payment_method: isUnpaid ? 'UNPAID' : (bodyData?.payment_method || 'CASH'),
          payment_reference: isUnpaid ? '' : (bodyData?.payment_reference || ''),
          is_paid: !isUnpaid,
          is_offline_pending: true,
          offline_queue_id: queueId,
          services: Array.isArray(bodyData?.services) ? bodyData.services : []
        };

        const cached = offlineEngine.getCached('/washes/') || [];
        if (Array.isArray(cached)) {
          offlineEngine.setCached('/washes/', [syntheticWash, ...cached]);
        }
        if (syntheticWash.status === 'PENDING') {
          const pendingCached = offlineEngine.getCached('/washes/pending/') || [];
          if (Array.isArray(pendingCached)) {
            offlineEngine.setCached('/washes/pending/', [syntheticWash, ...pendingCached]);
          }
        }
        return syntheticWash;
      }

      // Worker payment creation
      if (cleanPath.startsWith('/worker-payments/') && method === 'POST') {
        const payoutId = 'OFFLINE-PAY-' + Date.now();
        const syntheticPayout = {
          id: payoutId,
          worker_id: bodyData?.worker_id,
          amount_paid: Number(bodyData?.amount_paid || 0),
          payment_method: bodyData?.payment_method || 'CASH',
          transaction_reference: bodyData?.transaction_reference || '',
          notes: bodyData?.notes || '',
          paid_at: new Date().toISOString(),
          is_offline_pending: true,
          offline_queue_id: queueId
        };
        const cached = offlineEngine.getCached('/worker-payments/') || [];
        if (Array.isArray(cached)) {
          offlineEngine.setCached('/worker-payments/', [syntheticPayout, ...cached]);
        }
        // Deduct from worker balance
        const workers = offlineEngine.getCached('/workers/') || [];
        if (Array.isArray(workers)) {
          const updated = workers.map(w => {
            if (w.id === bodyData?.worker_id) {
              return {
                ...w,
                total_paid: Number(w.total_paid || 0) + Number(bodyData?.amount_paid || 0),
                outstanding_balance: Number(w.outstanding_balance || 0) - Number(bodyData?.amount_paid || 0)
              };
            }
            return w;
          });
          offlineEngine.setCached('/workers/', updated);
        }
        return syntheticPayout;
      }

      // Expense creation
      if (cleanPath.startsWith('/expenses/') && method === 'POST') {
        const expId = 'OFFLINE-EXP-' + Date.now();
        const syntheticExp = {
          id: expId,
          date: bodyData?.date || new Date().toISOString().split('T')[0],
          category: bodyData?.category || 'OTHER',
          title: bodyData?.title || 'Expense',
          amount: Number(bodyData?.amount || 0),
          notes: bodyData?.notes || '',
          is_offline_pending: true,
          offline_queue_id: queueId
        };
        const cached = offlineEngine.getCached('/expenses/') || [];
        if (Array.isArray(cached)) {
          offlineEngine.setCached('/expenses/', [syntheticExp, ...cached]);
        }
        return syntheticExp;
      }

      // Daily closing creation
      if (cleanPath.startsWith('/daily-closings/') && method === 'POST') {
        const closingData = {
          ...bodyData,
          id: 'OFFLINE-CLOSE-' + Date.now(),
          closed_at: new Date().toISOString(),
          is_offline_pending: true,
          offline_queue_id: queueId
        };
        const preview = offlineEngine.getCached(`/daily-closings/preview/?date=${bodyData?.date}`) || {};
        offlineEngine.setCached(`/daily-closings/preview/?date=${bodyData?.date}`, {
          ...preview,
          is_already_closed: true,
          existing_closing: closingData
        });
        return closingData;
      }

      // Attendance
      if (cleanPath.startsWith('/attendance/') && method === 'POST') {
        const attData = {
          ...bodyData,
          id: 'OFFLINE-ATT-' + Date.now(),
          created_at: new Date().toISOString(),
          is_offline_pending: true,
          offline_queue_id: queueId
        };
        const cached = offlineEngine.getCached('/attendance/') || [];
        if (Array.isArray(cached)) {
          offlineEngine.setCached('/attendance/', [attData, ...cached]);
        }
        return attData;
      }

      return { status: 'queued', offline_queue_id: queueId };
    };

    // Auto-Sync Controller: Automatically synchronizes offline changes the moment internet reconnects
    const syncEngine = (() => {
      let isSyncing = false;
      const statusListeners = [];

      const notify = () => {
        statusListeners.forEach(fn => {
          try { fn({ isSyncing, pendingCount: offlineEngine.getQueue().length }); } catch (e) {}
        });
      };

      const subscribe = (fn) => {
        statusListeners.push(fn);
        return () => {
          const idx = statusListeners.indexOf(fn);
          if (idx !== -1) statusListeners.splice(idx, 1);
        };
      };

      const syncNow = async (showToast = null, onComplete = null) => {
        if (isSyncing) return;
        if (!navigator.onLine) {
          if (showToast) showToast('Device is currently offline. Will sync once connected.', 'info');
          return;
        }

        const queue = offlineEngine.getQueue();
        if (queue.length === 0) {
          if (showToast) showToast('Everything is up-to-date! No pending offline records.', 'info');
          return;
        }

        isSyncing = true;
        notify();
        if (showToast) showToast(`Syncing ${queue.length} offline record(s) to server...`, 'info');

        let syncedCount = 0;
        const failedItems = [];

        for (const item of queue) {
          try {
            const token = safeStore.getItem('cw_token');
            const endpointPath = item.endpoint.startsWith('/') ? item.endpoint : `/${item.endpoint}`;
            const res = await fetch(`${API_BASE}${endpointPath}`, {
              method: item.method,
              headers: {
                'Content-Type': 'application/json',
                ...(token ? { 'Authorization': `Bearer ${token}` } : {})
              },
              body: item.body ? JSON.stringify(item.body) : undefined
            });

            if (res.ok || res.status === 201 || res.status === 200 || res.status === 400 || res.status === 409) {
              offlineEngine.dequeue(item.id);
              syncedCount++;
            } else {
              failedItems.push(item);
            }
          } catch (err) {
            console.warn('[SyncEngine] Network error syncing item:', item, err);
            failedItems.push(item);
            break;
          }
        }

        isSyncing = false;
        notify();

        if (syncedCount > 0) {
          if (showToast) showToast(`✅ Successfully synced ${syncedCount} offline record(s) to server!`, 'success');
          window.dispatchEvent(new CustomEvent('shell_data_synced'));
          if (onComplete) onComplete();
        } else if (failedItems.length > 0 && showToast) {
          showToast(`Sync paused. ${failedItems.length} record(s) queued for next connection.`, 'info');
        }
      };

      // Auto-trigger sync when device comes back online!
      window.addEventListener('online', () => {
        console.log('[SyncEngine] Network restored! Auto-updating offline records...');
        setTimeout(() => syncNow(), 1500);
      });

      // Periodic heartbeat check every 25 seconds
      setInterval(() => {
        if (navigator.onLine && offlineEngine.getQueue().length > 0 && !isSyncing) {
          syncNow();
        }
      }, 25000);

      return {
        syncNow,
        subscribe,
        isSyncing: () => isSyncing
      };
    })();

    // Dynamic backend API base for Vercel & Render deployments
    const getBackendBase = () => {
      try {
        const stored = safeStore.getItem('cw_api_base_url');
        if (stored && stored.trim()) return stored.trim().replace(/\/+$/, '');
      } catch (e) {}
      if (typeof window !== 'undefined' && window.__ENV__ && window.__ENV__.API_URL) {
        return window.__ENV__.API_URL.replace(/\/+$/, '');
      }
      return 'https://carwash-backend-4kk7.onrender.com';
    };

    const getApiBase = () => {
      const base = getBackendBase();
      if (!base) return '/api';
      return base.endsWith('/api') ? base : `${base}/api`;
    };

    const API_BASE = getApiBase();
    const authFetch = async (endpoint, options = {}) => {
      const token = safeStore.getItem('cw_token');
      const method = (options.method || 'GET').toUpperCase();
      const headers = {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {}),
        ...(options.headers || {})
      };

      const cacheKey = endpoint.split('?')[0];

      // If browser is offline and method is GET: serve from cache
      if (!navigator.onLine && method === 'GET') {
        const cached = offlineEngine.getCached(cacheKey);
        if (cached !== null) {
          return new Response(JSON.stringify(cached), {
            status: 200,
            headers: { 'Content-Type': 'application/json', 'X-Offline-Cache': 'true' }
          });
        }
      }

      // If browser is offline and method is mutation: queue and update local state
      if (!navigator.onLine && method !== 'GET') {
        let bodyData = null;
        try { bodyData = options.body ? JSON.parse(options.body) : null; }
        catch (e) { bodyData = options.body; }

        const queued = offlineEngine.enqueue({
          endpoint,
          method,
          body: bodyData,
          description: `${method} ${endpoint}`
        });

        const syntheticResponse = handleOptimisticOfflineMutation(endpoint, method, bodyData, queued.id);
        return new Response(JSON.stringify(syntheticResponse), {
          status: 201,
          headers: { 'Content-Type': 'application/json', 'X-Offline-Queued': 'true' }
        });
      }

      try {
        const response = await fetch(`${API_BASE}${endpoint}`, { ...options, headers });
        if (response.status === 401) {
          safeStore.removeItem('cw_token');
          safeStore.removeItem('cw_user');
          window.location.reload();
        }

        // Cache successful GET responses
        if (method === 'GET' && response.ok) {
          const clone = response.clone();
          clone.json().then(data => {
            offlineEngine.setCached(cacheKey, data);
          }).catch(() => {});
        }

        return response;
      } catch (networkError) {
        console.warn(`[Network Drop] on ${method} ${endpoint}:`, networkError);

        if (method === 'GET') {
          const cached = offlineEngine.getCached(cacheKey);
          if (cached !== null) {
            return new Response(JSON.stringify(cached), {
              status: 200,
              headers: { 'Content-Type': 'application/json', 'X-Offline-Cache': 'true' }
            });
          }
        } else {
          let bodyData = null;
          try { bodyData = options.body ? JSON.parse(options.body) : null; }
          catch (e) { bodyData = options.body; }

          const queued = offlineEngine.enqueue({
            endpoint,
            method,
            body: bodyData,
            description: `${method} ${endpoint}`
          });

          const syntheticResponse = handleOptimisticOfflineMutation(endpoint, method, bodyData, queued.id);
          return new Response(JSON.stringify(syntheticResponse), {
            status: 201,
            headers: { 'Content-Type': 'application/json', 'X-Offline-Queued': 'true' }
          });
        }

        throw networkError;
      }
    };

    // ==========================================
    // NETWORK STATUS & OFFLINE QUEUE MODAL
    // ==========================================
    function NetworkStatusBar({ showToast }) {
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [syncQueue, setSyncQueue] = useState(offlineEngine.getQueue());
      const [isSyncing, setIsSyncing] = useState(syncEngine.isSyncing());
      const [modalOpen, setModalOpen] = useState(false);

      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);

        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);

        const unsubQueue = offlineEngine.subscribe(q => setSyncQueue(q));
        const unsubSync = syncEngine.subscribe(s => setIsSyncing(s.isSyncing));

        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
          unsubQueue();
          unsubSync();
        };
      }, []);

      const handleTriggerSync = () => {
        syncEngine.syncNow(showToast);
      };

      const handleExportOfflineData = () => {
        const queue = offlineEngine.getQueue();
        const cachedWashes = offlineEngine.getCached('/washes/') || [];
        const cachedWorkers = offlineEngine.getCached('/workers/') || [];

        let csv = "SHELL CAR WASH - OFFLINE EMERGENCY DATA BACKUP\n";
        csv += `Exported At,${new Date().toISOString()}\n`;
        csv += `Pending Unsynced Actions,${queue.length}\n\n`;

        csv += "--- PENDING OFFLINE QUEUE ---\n";
        csv += "ID,Time,Endpoint,Method,Details\n";
        queue.forEach(q => {
          csv += `"${q.id}","${q.timestamp}","${q.endpoint}","${q.method}","${JSON.stringify(q.body || {}).replace(/"/g, '""')}"\n`;
        });

        csv += "\n--- CACHED WASHES ---\n";
        csv += "ID,Date,Plate,Total Amount,Payment Method,Status,Offline Pending\n";
        cachedWashes.forEach(w => {
          csv += `"${w.id}","${w.created_at || ''}","${w.vehicle?.plate_number || ''}","${w.total_amount || 0}","${w.payment_method || ''}","${w.status || ''}","${w.is_offline_pending ? 'YES' : 'NO'}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `shell_carwash_offline_backup_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        if (showToast) showToast('Offline backup CSV downloaded successfully!', 'success');
      };

      return (
        <React.Fragment>
          <div className="flex items-center space-x-2">
            <button
              onClick={() => setModalOpen(true)}
              className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-bold transition shadow-xs ${
                isOnline
                  ? syncQueue.length > 0
                    ? 'bg-amber-100 text-amber-900 border border-amber-300 animate-pulse'
                    : 'bg-emerald-100 text-emerald-900 border border-emerald-300'
                  : 'bg-amber-600 text-white border border-amber-700 animate-pulse'
              }`}
            >
              <span className={`w-2 h-2 rounded-full ${isOnline ? (syncQueue.length > 0 ? 'bg-amber-500' : 'bg-emerald-500') : 'bg-white'}`}></span>
              <span>
                {isOnline
                  ? syncQueue.length > 0
                    ? `${syncQueue.length} Pending Sync`
                    : 'Online'
                  : `Offline (${syncQueue.length} queued)`}
              </span>
            </button>

            {isOnline && (
              <button
                onClick={handleTriggerSync}
                disabled={isSyncing}
                title="Sync now with server"
                className="p-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition disabled:opacity-50"
              >
                {isSyncing ? '🔄 Syncing...' : '🔄 Sync'}
              </button>
            )}
          </div>

          {/* Offline Sync Manager Modal */}
          {modalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 shadow-2xl border border-slate-200">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div className="flex items-center space-x-2.5">
                    <span className="text-2xl">{isOnline ? '🟢' : '🟠'}</span>
                    <div>
                      <h3 className="font-extrabold text-slate-900 text-lg">Offline Mode & Auto-Sync</h3>
                      <p className="text-xs text-slate-500">
                        {isOnline ? 'Connected to internet. Records auto-sync to server.' : 'Running fully offline. All actions saved locally.'}
                      </p>
                    </div>
                  </div>
                  <button
                    onClick={() => setModalOpen(false)}
                    className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 flex items-center justify-center font-bold text-sm"
                  >
                    ✕
                  </button>
                </div>

                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2 text-xs">
                  <div className="flex justify-between font-bold text-slate-700">
                    <span>Network Connection:</span>
                    <span className={isOnline ? 'text-emerald-700' : 'text-amber-700 font-extrabold'}>
                      {isOnline ? 'Active (Connected)' : 'Disconnected (Offline)'}
                    </span>
                  </div>
                  <div className="flex justify-between font-bold text-slate-700">
                    <span>Pending Local Changes:</span>
                    <span className="text-blue-700 font-extrabold">{syncQueue.length} records</span>
                  </div>
                  <div className="flex justify-between text-slate-500 text-[11px]">

    function App() {
      const [token, setToken] = useState(safeStore.getItem('cw_token') || '');
      const [currentUser, setCurrentUser] = useState(JSON.parse(safeStore.getItem('cw_user') || 'null'));
      const [activeTab, setActiveTab] = useState('dashboard');
      const [toast, setToast] = useState(null);

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const handleLoginSuccess = (user, authToken) => {
        setToken(authToken);
        setCurrentUser(user);
        safeStore.setItem('cw_token', authToken);
        safeStore.setItem('cw_user', JSON.stringify(user));
        setActiveTab('dashboard');
        showToast(`Welcome back, ${user.first_name || user.username}!`);
      };

      const handleLogout = () => {
        setToken('');
        setCurrentUser(null);
        safeStore.removeItem('cw_token');
        safeStore.removeItem('cw_user');
        showToast('You have been signed out safely.', 'info');
      };

      // If not logged in, render the authentic Login Screen exclusively
      if (!token || !currentUser) {
        return (
          <LoginPage onLoginSuccess={handleLoginSuccess} showToast={showToast} />
        );
      }

      // If authenticated, render role-specific portal
      const isAdminOrCashier = currentUser.role === 'ADMIN' || currentUser.role === 'CASHIER';

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {/* Toast Notification */}
          {toast && (
            <div className={`fixed top-5 right-5 z-50 px-4 py-3 rounded-2xl shadow-2xl text-xs sm:text-sm font-extrabold flex items-center space-x-2 transition-all transform animate-bounce ${toast.type === 'error' ? 'bg-red-600 text-white' : 'bg-emerald-600 text-white'}`}>
              <span>{toast.type === 'error' ? '⚠️' : '✅'}</span>
              <span>{toast.message}</span>
            </div>
          )}

          {/* Active Portal Body */}
          {isAdminOrCashier ? (
            <AdminPortal 
              activeTab={activeTab} 
              setActiveTab={setActiveTab} 
              showToast={showToast}
              currentUser={currentUser}
              onLogout={handleLogout}
            />
          ) : (
            <WorkerPortal 
              currentUser={currentUser}
              selectedWorkerId={currentUser.worker_profile_id || 1}
              showToast={showToast}
              onLogout={handleLogout}
            />
          )}
        </div>
      );
    }

    function LoginPage({ onLoginSuccess, showToast }) {
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [showServerConfig, setShowServerConfig] = useState(false);
      const [serverInput, setServerInput] = useState(getBackendBase() || '');

      const handleSaveServer = () => {
        if (!serverInput.trim()) {
          safeStore.removeItem('cw_api_base_url');
          showToast('Server reset to default (/api). Reloading...', 'info');
        } else {
          safeStore.setItem('cw_api_base_url', serverInput.trim());
          showToast(`Server URL saved: ${serverInput.trim()}. Reloading...`, 'success');
        }
        setTimeout(() => window.location.reload(), 400);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!username.trim() || !password.trim()) {
          setError('Please provide both username and password');
          return;
        }

        setLoading(true);
        setError('');
        try {
          const res = await fetch(`${API_BASE}/auth/login/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username.trim(), password })
          });

          const data = await res.json();
          if (res.ok && data.token) {
            onLoginSuccess(data.user, data.token);
          } else {
            setError(data.error || 'Invalid username or password');
          }
        } catch (err) {
          setError('Network error connecting to authentication server.');
        } finally {
          setLoading(false);
        }
      };

      const fillDemo = (u, p) => {
        setUsername(u);
        setPassword(p);
      };

              <button

            {/* Server Connection Setting (Render / Vercel) */}

                  </p>
                </div>

            </div>
          </div>
        </div>
      );
    }

        authFetch('/washes/pending/')
          .then(res => res.json())
          .then(data => { if (Array.isArray(data)) setPendingCount(data.length); })
          .catch(() => {});
      };

      useEffect(() => {
        loadPendingCount();
        const interval = setInterval(loadPendingCount, 15000);
        return () => clearInterval(interval);
      }, []);

      // Edge Swipe: Swiping right from anywhere on left edge opens sidebar drawer from anywhere
      useEffect(() => {
        let touchStartX = 0;
        let touchStartY = 0;

        const handleTouchStart = (e) => {
          if (e.touches && e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          }
        };

        const handleTouchEnd = (e) => {
          if (!touchStartX) return;
          const touchEndX = e.changedTouches[0].clientX;
          const touchEndY = e.changedTouches[0].clientY;
          const diffX = touchEndX - touchStartX;
          const diffY = touchEndY - touchStartY;

          // If swiped right from anywhere near the left side of the screen (< 80px)
          if (diffX > 50 && Math.abs(diffX) > Math.abs(diffY) && touchStartX < 80) {
            setMobileMenuOpen(true);
          }
          // If drawer is open and swiped left, close it
          if (diffX < -50 && Math.abs(diffX) > Math.abs(diffY) && mobileMenuOpen) {
            setMobileMenuOpen(false);
          }
          touchStartX = 0;
          touchStartY = 0;
        };

        window.addEventListener('touchstart', handleTouchStart, { passive: true });
        window.addEventListener('touchend', handleTouchEnd, { passive: true });

          window.removeEventListener('touchstart', handleTouchStart);
          window.removeEventListener('touchend', handleTouchEnd);

    // ==========================================
    // 2. ADMIN DASHBOARD - SHELL CAR WASH
    // ==========================================
    function AdminDashboard({ setActiveTab, showToast }) {
      const [filter, setFilter] = useState('today');
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [bayFilter, setBayFilter] = useState('all');

      // Unpaid washes on site awaiting collection
      const [unpaidWashes, setUnpaidWashes] = useState([]);
      const [unpaidLoading, setUnpaidLoading] = useState(true);

      // Collect Payment Modal (directly from Dashboard)
      const [collectModalOpen, setCollectModalOpen] = useState(false);
      const [collectingWash, setCollectingWash] = useState(null);
      const [collectMethod, setCollectMethod] = useState('MPESA');
      const [collectRef, setCollectRef] = useState('');
      const [collectSplitCash, setCollectSplitCash] = useState('');
      const [collectSplitMpesa, setCollectSplitMpesa] = useState('');
      const [collectCashTendered, setCollectCashTendered] = useState('');
      const [submittingCollect, setSubmittingCollect] = useState(false);

      // Quick Log Wash Modal (directly from Dashboard)
      const [quickLogModalOpen, setQuickLogModalOpen] = useState(false);
      const [servicesList, setServicesList] = useState([]);
      const [workersList, setWorkersList] = useState([]);
      const [quickPlate, setQuickPlate] = useState('');
      const [quickVehicleType, setQuickVehicleType] = useState('SEDAN');
      const [quickCustomerName, setQuickCustomerName] = useState('');
      const [quickCustomerPhone, setQuickCustomerPhone] = useState('');
      const [quickBay, setQuickBay] = useState(1);
      const [quickServiceId, setQuickServiceId] = useState('');
      const [quickWorkerIds, setQuickWorkerIds] = useState([]);
      const [quickPayLater, setQuickPayLater] = useState(true); // Default to skip payment
      const [quickPaymentMethod, setQuickPaymentMethod] = useState('MPESA');
      const [quickPaymentRef, setQuickPaymentRef] = useState('');
      const [submittingQuickLog, setSubmittingQuickLog] = useState(false);

      const loadSummary = (f) => {
        setLoading(true);
        authFetch(`/reports/summary/?filter=${f}`)
          .then(res => res.json())
          .then(resData => {
            setData(resData);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      };

      const loadUnpaidWashes = () => {
        setUnpaidLoading(true);
        authFetch('/washes/unpaid/')
          .then(res => res.json())
          .then(wData => {
            setUnpaidWashes(Array.isArray(wData) ? wData : []);
            setUnpaidLoading(false);
          })
          .catch(() => setUnpaidLoading(false));
      };

      const loadFormDependencies = () => {
        authFetch('/services/?active_only=true')
          .then(r => r.json())
          .then(d => {
            const list = Array.isArray(d) ? d : d.results || [];
            setServicesList(list);
            if (list.length > 0 && !quickServiceId) setQuickServiceId(list[0].id);
          });

        authFetch('/workers/?active_only=true')
          .then(r => r.json())
          .then(d => {
            const list = Array.isArray(d) ? d : d.results || [];
            setWorkersList(list);
            if (list.length > 0 && quickWorkerIds.length === 0) {
              setQuickWorkerIds([list[0].id]);
            }
          });
      };

      useEffect(() => {
        loadSummary(filter);
        loadUnpaidWashes();
        loadFormDependencies();
      }, [filter]);

      // Open payment collection modal from dashboard
      const openDashboardCollect = (w) => {
        setCollectingWash(w);
        setCollectMethod('MPESA');
        setCollectRef('');
        const amt = Number(w.total_amount || 0);
        const half = Math.floor(amt / 2);
        setCollectSplitCash(String(half));
        setCollectSplitMpesa(String(amt - half));
        setCollectCashTendered('');
        setCollectModalOpen(true);
      };

      const handleConfirmCollect = async (e) => {
        e.preventDefault();
        if (!collectingWash) return;

        const total = Number(collectingWash.total_amount || 0);
        if (collectMethod === 'SPLIT') {
          const c = Number(collectSplitCash || 0);
          const m = Number(collectSplitMpesa || 0);
          if (c + m !== total) {
            if (showToast) showToast(`Split amounts (Cash: KSh ${c} + M-Pesa: KSh ${m}) must equal total KSh ${total}`, 'error');
            return;
          }
        }

        setSubmittingCollect(true);
        try {
          const payload = {
            payment_method: collectMethod,
            cash_amount: collectMethod === 'CASH' ? total : collectMethod === 'SPLIT' ? Number(collectSplitCash || 0) : 0,
            mpesa_amount: collectMethod === 'MPESA' ? total : collectMethod === 'SPLIT' ? Number(collectSplitMpesa || 0) : 0,
            payment_reference: collectRef.trim()
          };

          const res = await authFetch(`/washes/${collectingWash.id}/collect_payment/`, {
            method: 'POST',
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            if (showToast) showToast(`Payment of KSh ${total.toLocaleString()} collected for ${collectingWash.vehicle.plate_number}! Bill settled.`, 'success');
            setCollectModalOpen(false);
            setCollectingWash(null);
            loadSummary(filter);
            loadUnpaidWashes();
          } else {
            const err = await res.json();
            if (showToast) showToast(err.error || 'Failed to collect payment', 'error');
          }
        } catch (err) {
          if (showToast) showToast('Error collecting payment', 'error');
        } finally {
          setSubmittingCollect(false);
        }
      };

      // Toggle worker selection for quick log (multi-worker)
      const toggleQuickWorker = (wid) => {
        setQuickWorkerIds(prev => {
          if (prev.includes(wid)) {
            if (prev.length <= 1) {
              if (showToast) showToast('At least one worker must be assigned.', 'error');
              return prev;
            }
            return prev.filter(id => id !== wid);
          }
          return [...prev, wid];
        });
      };

      // Submit Quick Log Wash
      const handleQuickLogSubmit = async (e) => {
        e.preventDefault();
        if (!quickPlate.trim()) {
          if (showToast) showToast('Enter plate number', 'error');
          return;
        }

        const chosenSrv = servicesList.find(s => s.id === Number(quickServiceId));
        if (!chosenSrv) return;

        const srvPrice = Number(chosenSrv.default_price || 0);
        if (quickWorkerIds.length === 0) {
          if (showToast) showToast('Assign at least one worker to this wash', 'error');
          return;
        }

        setSubmittingQuickLog(true);
        try {
          const payload = {
            plate_number: quickPlate.toUpperCase().trim(),
            vehicle_type: quickVehicleType,
            customer_name: quickCustomerName,
            customer_phone: quickCustomerPhone,
            bay_number: Number(quickBay),
            payment_method: quickPayLater ? 'UNPAID' : quickPaymentMethod,
            cash_amount: quickPayLater ? 0 : (quickPaymentMethod === 'CASH' ? srvPrice : 0),
            mpesa_amount: quickPayLater ? 0 : (quickPaymentMethod === 'MPESA' ? srvPrice : 0),
            payment_reference: quickPayLater ? '' : quickPaymentRef,
            is_paid: !quickPayLater,
            notes: quickPayLater ? 'Pay on Collection (Owner will pay upon pickup)' : '',
            items: [
              {
                service_id: chosenSrv.id,
                price_charged: chosenSrv.default_price,
                worker_ids: quickWorkerIds
              }
            ]
          };

          const res = await authFetch('/washes/', {
            method: 'POST',
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            if (showToast) {
              showToast(
                quickPayLater
                  ? `Vehicle ${quickPlate.toUpperCase()} logged (UNPAID)! Collect money when owner returns.`
                  : `Car Wash for ${quickPlate.toUpperCase()} recorded and paid!`,
                'success'
              );
            }
            setQuickLogModalOpen(false);
            setQuickPlate('');
            setQuickCustomerName('');
            setQuickCustomerPhone('');
            loadSummary(filter);
            loadUnpaidWashes();
          } else {
            const err = await res.json();
            if (showToast) showToast(err.error || 'Failed to record wash', 'error');
          }
        } catch (err) {
          if (showToast) showToast('Error recording wash', 'error');
        } finally {
          setSubmittingQuickLog(false);
        }
      };

      const selectedQuickSrv = servicesList.find(s => s.id === Number(quickServiceId));
      const quickCommPerWorker = selectedQuickSrv && quickWorkerIds.length > 0
        ? (Number(selectedQuickSrv.default_commission_value || 0) / quickWorkerIds.length).toFixed(2)
        : 0;

      const bayStations = [
        { id: 1, name: 'Bay Area : 1', current: 'KDA 124B', status: 'Operational', time: '12 min', staff: 3, inQueue: 2 },
        { id: 2, name: 'Bay Area : 2', current: 'KDF 992P', status: 'Operational', time: '10 min', staff: 2, inQueue: 1 },
        { id: 3, name: 'Bay Area : 3', current: 'KDE 312M', status: 'Operational', time: '15 min', staff: 2, inQueue: 3 },
        { id: 4, name: 'Bay Area : 4', current: 'None (Ready)', status: 'Operational', time: '0 min', staff: 1, inQueue: 0 },
      ];

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight flex items-center space-x-2">
                <span>🚗 Shell Carwash Operations Dashboard</span>
              </h1>
              <p className="text-xs sm:text-sm text-slate-500">Real-time Shell Carwash bays, customer billing, and multi-worker commission splits</p>
            </div>

            {/* Quick Action Buttons & Time Filter Tabs */}
            <div className="flex flex-wrap items-center gap-2">
              <button
                onClick={() => {
                  setQuickPayLater(true);
                  setQuickLogModalOpen(true);
                }}
                className="bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs px-3.5 py-2 rounded-xl shadow-xs transition flex items-center space-x-1.5"
                title="Log a wash now without taking payment - collect when customer returns"
              >
                <span>⏳</span>
                <span>Log Wash (Skip Payment)</span>
              </button>

              <button
                onClick={() => setActiveTab('record')}
                className="bg-blue-600 hover:bg-blue-700 text-white font-extrabold text-xs px-3.5 py-2 rounded-xl shadow-xs transition flex items-center space-x-1.5"
              >
                <span>+</span>
                <span>Record Wash Visit</span>
              </button>

              <div className="flex items-center space-x-1 bg-white p-1 rounded-xl shadow-xs border border-slate-200">
                {[
                  { id: 'today', label: 'Today' },
                  { id: 'yesterday', label: 'Yesterday' },
                  { id: 'week', label: 'This Week' },
                  { id: 'month', label: 'This Month' },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setFilter(tab.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${
                      filter === tab.id ? 'bg-slate-900 text-white shadow-xs' : 'text-slate-600 hover:bg-slate-100'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Top KPI Cards */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between">
              <div>
                <p className="text-[11px] font-bold uppercase tracking-wider text-slate-400">Cars Washed</p>
                <h3 className="text-3xl font-extrabold text-slate-900 mt-1">
                  {loading ? '...' : (data?.total_cars || 0)}
                </h3>
                <span className="text-[11px] text-emerald-600 font-bold">✓ Approved Washes</span>
              </div>
              <div className="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center text-2xl font-bold">
                🚗
              </div>
            </div>

            <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-xs flex items-center justify-between">
              <div>
                <p className="text-[11px] font-bold uppercase tracking-wider text-slate-400">Total Revenue</p>
                <h3 className="text-2xl sm:text-3xl font-extrabold text-slate-900 mt-1">
                  KSh {loading ? '...' : Number(data?.total_revenue || 0).toLocaleString()}

                <span className="text-[11px] text-emerald-600 font-bold">Gross Customer Bills</span>

              <div className="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl font-bold">

                        <span>Dual Split:</span>
                        <span>Total: KSh {Number(collectingWash.total_amount).toLocaleString()}</span>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[10px] font-bold text-slate-600 uppercase mb-0.5">Cash (KSh)</label>
                          <input
                            type="number"
                            value={collectSplitCash}
                            onChange={e => {
                              const val = e.target.value;
                              setCollectSplitCash(val);
                              const tot = Number(collectingWash.total_amount || 0);
                              setCollectSplitMpesa(String(Math.max(0, tot - Number(val || 0))));
                            }}
                            className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-extrabold bg-white"
                          />
                        </div>
                        <div>
                          <label className="block text-[10px] font-bold text-slate-600 uppercase mb-0.5">M-Pesa (KSh)</label>
                          <input
                            type="number"
                            value={collectSplitMpesa}
                            onChange={e => {
                              const val = e.target.value;
                              setCollectSplitMpesa(val);
                              const tot = Number(collectingWash.total_amount || 0);
                              setCollectSplitCash(String(Math.max(0, tot - Number(val || 0))));
                            }}
                            className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-extrabold bg-white"
                          />
                        </div>
                      </div>
                      <div>
                        <label className="block text-[10px] font-bold text-slate-600 uppercase mb-0.5">M-Pesa Reference</label>
                        <input
                          type="text"
                          placeholder="e.g. SLK89271KJ"
                          value={collectRef}
                          onChange={e => setCollectRef(e.target.value)}
                          className="w-full px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-mono font-bold uppercase bg-white"
                        />
                      </div>
                    </div>
                  )}

                  <div className="pt-2 flex items-center space-x-2">
                    <button
                      type="button"
                      onClick={() => { setCollectModalOpen(false); setCollectingWash(null); }}
                      className="w-1/3 py-2.5 rounded-xl border border-slate-300 text-slate-600 font-bold hover:bg-slate-50 transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={submittingCollect}
                      className="w-2/3 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold shadow-md transition disabled:opacity-50"
                    >
                      {submittingCollect ? 'Updating...' : '✓ Settle & Mark as Paid'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 3. RECORD CAR WASH MODULE (With VIP Lookup & Multi-worker split)
    // ==========================================
    function RecordCarWashForm({ showToast, setActiveTab }) {
      const [plateNumber, setPlateNumber] = useState('');
      const [vehicleType, setVehicleType] = useState('SEDAN');
      const [makeModel, setMakeModel] = useState('');
      const [customerName, setCustomerName] = useState('');
      const [customerPhone, setCustomerPhone] = useState('');
      const [bayNumber, setBayNumber] = useState(1);
      const [paymentMethod, setPaymentMethod] = useState('MPESA');
      const [payLater, setPayLater] = useState(false);
      const [splitCash, setSplitCash] = useState('');
      const [splitMpesa, setSplitMpesa] = useState('');
      const [paymentReference, setPaymentReference] = useState('');
      const [notes, setNotes] = useState('');

      const [servicesList, setServicesList] = useState([]);
      const [workersList, setWorkersList] = useState([]);
      const [selectedAttendantIds, setSelectedAttendantIds] = useState([]);
      const [selectedServices, setSelectedServices] = useState({});
      const [submitting, setSubmitting] = useState(false);
      const [lookupResult, setLookupResult] = useState(null);

      useEffect(() => {
        authFetch('/services/?active_only=true')
          .then(r => r.json())
          .then(d => setServicesList(Array.isArray(d) ? d : d.results || []));

        authFetch('/workers/?active_only=true')
          .then(r => r.json())
          .then(d => {
            const list = Array.isArray(d) ? d : d.results || [];
            setWorkersList(list);
            if (list.length > 0) {
              setSelectedAttendantIds([list[0].id]);
            }
          });
      }, []);

      // Toggle who did the work across the entire vehicle wash
      const toggleGlobalAttendant = (workerId) => {
        const wid = Number(workerId);
        setSelectedAttendantIds(prev => {
          const next = prev.includes(wid) ? prev.filter(id => id !== wid) : [...prev, wid];
          // Also synchronize all currently selected services to match the updated worker team
          setSelectedServices(curServices => {
            const updated = {};
            for (const [srvId, srvData] of Object.entries(curServices)) {
              updated[srvId] = {
                ...srvData,
                workerIds: next.length > 0 ? next : (prev.includes(wid) ? [wid] : next)
              };
            }
            return updated;
          });
          return next;
        });
      };

      // Select all active workers
      const handleSelectAllAttendants = () => {
        const allIds = workersList.map(w => w.id);
        setSelectedAttendantIds(allIds);
        setSelectedServices(curServices => {
          const updated = {};
          for (const [srvId, srvData] of Object.entries(curServices)) {
            updated[srvId] = { ...srvData, workerIds: allIds };
          }
          return updated;
        });
      };

      // Clear all attendants
      const handleClearAttendants = () => {
        setSelectedAttendantIds([]);
      };

      // Auto-lookup vehicle when plate number changes
      useEffect(() => {
        const clean = plateNumber.trim().toUpperCase();
        if (clean.length >= 4) {
          const timeout = setTimeout(() => {
            authFetch(`/vehicles/lookup/?plate=${clean}`)
              .then(r => r.json())
              .then(res => {
                if (res.exists) {
                  setLookupResult(res);
                  if (!makeModel) setMakeModel(res.make_model || '');
                  if (!customerName) setCustomerName(res.customer_name || '');
                  if (!customerPhone) setCustomerPhone(res.customer_phone || '');
                  if (res.vehicle_type) setVehicleType(res.vehicle_type);
                } else {
                  setLookupResult(null);
                }
              })
              .catch(() => {});
          }, 400);
          return () => clearTimeout(timeout);
        } else {
          setLookupResult(null);
        }
      }, [plateNumber]);

      const toggleService = (srv) => {
        setSelectedServices(prev => {
          const next = { ...prev };
          if (next[srv.id]) {
            delete next[srv.id];
          } else {
            const defaultTeam = selectedAttendantIds.length > 0
              ? [...selectedAttendantIds]
              : (workersList[0]?.id ? [workersList[0].id] : []);
            next[srv.id] = {
              price: srv.default_price,
              workerIds: defaultTeam,
              default_comm_type: srv.default_commission_type,
              default_comm_value: srv.default_commission_value,
              name: srv.name
            };
          }
          return next;
        });
      };

      const toggleWorkerForService = (serviceId, workerId) => {
        const wid = Number(workerId);
        setSelectedServices(prev => {
          const item = prev[serviceId];
          if (!item) return prev;
          const current = Array.isArray(item.workerIds) ? item.workerIds : [];
          let updated;
          if (current.includes(wid)) {
            if (current.length <= 1) {
              if (showToast) showToast('At least one employee must be assigned to this service.', 'error');
              return prev;
            }
            updated = current.filter(id => id !== wid);
          } else {
            updated = [...current, wid];
          }
          return {
            ...prev,
            [serviceId]: {
              ...item,
              workerIds: updated
            }
          };
        });
      };

      const totalAmount = useMemo(() => {
        return Object.values(selectedServices).reduce((sum, item) => sum + Number(item.price), 0);
      }, [selectedServices]);

      const estimatedCommissions = useMemo(() => {
        return Object.values(selectedServices).reduce((sum, item) => {
          let comm = 0;
          if (item.default_comm_type === 'PERCENTAGE') {
            comm = (Number(item.price) * Number(item.default_comm_value)) / 100;
          } else {
            comm = Number(item.default_comm_value);
          }
          return sum + comm;
        }, 0);
      }, [selectedServices]);

      const netBusinessRevenue = totalAmount - estimatedCommissions;

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!plateNumber.trim()) {
          showToast('Please enter plate number', 'error');
          return;
        }

        const items = Object.entries(selectedServices).map(([srvId, details]) => {
          const itemWorkers = (details.workerIds && details.workerIds.length > 0)
            ? details.workerIds
            : selectedAttendantIds;
          return {
            service_id: Number(srvId),
            price_charged: Number(details.price),
            worker_ids: itemWorkers
          };
        });

        if (items.length === 0) {
          showToast('Please select at least one service performed.', 'error');
          return;
        }

        if (items.some(it => !it.worker_ids || it.worker_ids.length === 0)) {
          showToast('Please select who did this work (at least one car wash attendant).', 'error');
          return;
        }

        if (!payLater && paymentMethod === 'SPLIT') {
          const cVal = Number(splitCash || 0);
          const mVal = Number(splitMpesa || 0);
          if (cVal + mVal !== totalAmount) {
            showToast(`Split amounts (Cash: KSh ${cVal} + M-Pesa: KSh ${mVal} = KSh ${cVal + mVal}) must equal total bill of KSh ${totalAmount}`, 'error');
            return;
          }
        }

        setSubmitting(true);
        try {
          const payload = {
            plate_number: plateNumber.toUpperCase().trim(),
            vehicle_type: vehicleType,
            make_model: makeModel,
            customer_name: customerName,
            customer_phone: customerPhone,
            bay_number: Number(bayNumber),
            payment_method: payLater ? 'UNPAID' : paymentMethod,
            cash_amount: payLater ? 0 : (paymentMethod === 'CASH' ? totalAmount : paymentMethod === 'SPLIT' ? Number(splitCash || 0) : 0),
            mpesa_amount: payLater ? 0 : (paymentMethod === 'MPESA' ? totalAmount : paymentMethod === 'SPLIT' ? Number(splitMpesa || 0) : 0),
            payment_reference: payLater ? '' : paymentReference,
            is_paid: !payLater,
            notes: payLater ? (notes ? `${notes} (Pay on Collection)` : 'Pay on Collection') : notes,
            items
          };

          const res = await authFetch('/washes/', {
            method: 'POST',
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            showToast(payLater ? `Wash for ${plateNumber.toUpperCase()} recorded (UNPAID)! Awaiting payment on vehicle collection.` : `Car Wash for ${plateNumber.toUpperCase()} recorded and commissions credited!`, 'success');
            setActiveTab('washes');
          } else {
            const err = await res.json();
            showToast(err.error || 'Failed to record wash', 'error');
          }
        } catch (err) {
          showToast('Error recording wash transaction', 'error');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="max-w-4xl mx-auto space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Record Car Wash Visit</h1>
              <p className="text-sm text-slate-500">Record vehicle, services, and assign workers to automatically calculate commissions</p>
            </div>
            <button onClick={() => setActiveTab('dashboard')} className="text-xs font-bold text-slate-400 hover:text-slate-600">
              ← Back to Dashboard
            </button>
          </div>

          <form onSubmit={handleSubmit} className="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
            {/* VIP Returning Customer Card */}
            {lookupResult && (
              <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl flex items-center justify-between text-xs text-emerald-900">
                <div className="flex items-center space-x-3">
                  <span className="text-xl">⭐</span>
                  <div>
                    <p className="font-extrabold text-sm text-emerald-900">Returning Customer Recognized!</p>
                    <p className="text-emerald-700">
                      {lookupResult.customer_name || 'Valued Client'} has completed <span className="font-bold">{lookupResult.total_washes} previous washes</span> (Lifetime Spend: KSh {Number(lookupResult.total_spent).toLocaleString()})
                    </p>
                  </div>
                </div>
                <span className="bg-emerald-200 text-emerald-900 px-2 py-0.5 rounded font-bold text-[10px]">VIP History</span>
              </div>
            )}

            {/* Step 1: Vehicle Information */}
            <div>
              <h3 className="text-base font-bold text-slate-900 mb-3 flex items-center space-x-2">
                <span className="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs">1</span>
                <span>Vehicle Details</span>
              </h3>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Plate Number *</label>
                  <input
                    type="text"
                    required
                    placeholder="e.g. KDA 124B"
                    value={plateNumber}
                    onChange={e => setPlateNumber(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-extrabold uppercase tracking-wider text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Vehicle Type</label>
                  <select
                    value={vehicleType}
                    onChange={e => setVehicleType(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-semibold text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  >
                    <option value="SEDAN">Saloon / Sedan</option>
                    <option value="SUV">SUV / 4x4</option>
                    <option value="VAN">Van / Pickup</option>
                    <option value="BODA">Motorbike / Boda</option>
                    <option value="TRUCK">Truck / Bus</option>
                  </select>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Make & Model</label>
                  <input
                    type="text"
                    placeholder="e.g. Toyota Probox"
                    value={makeModel}
                    onChange={e => setMakeModel(e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
                  />
                </div>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-3">
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Customer Name</label>
                  <input
                    type="text"
                    placeholder="e.g. David Ndirangu"
                    value={customerName}
                    onChange={e => setCustomerName(e.target.value)}
                    className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Customer Phone</label>
                  <input
                    type="text"
                    placeholder="e.g. 0722123456"
                    value={customerPhone}
                    onChange={e => setCustomerPhone(e.target.value)}
                    className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm"
                  />
                </div>
                <div>
                  <label className="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Bay Assigned</label>
                  <select
                    value={bayNumber}
                    onChange={e => setBayNumber(e.target.value)}
                    className="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm font-semibold"
                  >
                    <option value="1">Bay Area 1</option>
                    <option value="2">Bay Area 2</option>
                    <option value="3">Bay Area 3</option>
                    <option value="4">Bay Area 4</option>
                  </select>
                </div>
              </div>
            </div>

            <hr className="border-slate-100" />

            {/* Step 2: Who Did This Work? (Car Wash Workers / Attendants) */}
            <div className="bg-blue-50/70 p-5 rounded-3xl border-2 border-blue-200 space-y-3">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-2 border-b border-blue-200">
                <div className="flex items-center space-x-2.5">
                  <span className="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold shrink-0">2</span>
                  <div>
                    <h3 className="text-base font-black text-slate-900 leading-tight">Who Did This Work? (Assigned Car Wash Attendants) *</h3>
                    <p className="text-xs text-slate-600">Select the worker(s) who washed this vehicle. Commissions are automatically credited to them.</p>
                  </div>
                </div>
                <div className="flex items-center space-x-2 shrink-0">
                  <button
                    type="button"
                    onClick={handleSelectAllAttendants}
                    className="text-[11px] font-bold text-blue-700 hover:text-blue-900 px-2.5 py-1 bg-white rounded-xl border border-blue-300 shadow-2xs transition"
                  >
                    Select All
                  </button>
                  <button
                    type="button"
                    onClick={handleClearAttendants}
                    className="text-[11px] font-bold text-slate-600 hover:text-slate-800 px-2.5 py-1 bg-white rounded-xl border border-slate-300 shadow-2xs transition"
                  >
                    Clear
                  </button>
                </div>
              </div>

              {/* Attendants Grid */}
              <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 pt-1">
                {workersList.map(w => {
                  const isSelected = selectedAttendantIds.includes(w.id);
                  const wName = `${w.user.first_name || ''} ${w.user.last_name || ''}`.trim() || w.user.username;
                  const initials = (w.user.first_name?.[0] || w.user.username?.[0] || 'W').toUpperCase();
                  return (
                    <button
                      key={w.id}
                      type="button"
                      onClick={() => toggleGlobalAttendant(w.id)}
                      className={`p-3 rounded-2xl border text-left transition flex items-center justify-between shadow-2xs ${
                        isSelected
                          ? 'bg-blue-600 text-white border-blue-600 shadow-sm'
                          : 'bg-white hover:bg-slate-50 text-slate-800 border-slate-200'
                      }`}
                    >
                      <div className="flex items-center space-x-2.5 truncate">
                        <div className={`w-9 h-9 rounded-xl flex items-center justify-center font-black text-xs shrink-0 ${
                          isSelected ? 'bg-white text-blue-700 shadow-xs' : 'bg-blue-100 text-blue-700'
                        }`}>
                          {initials}
                        </div>
                        <div className="truncate">
                          <p className="font-extrabold text-xs truncate leading-tight">{wName}</p>
                          <p className={`text-[10px] truncate ${isSelected ? 'text-blue-100' : 'text-slate-400'}`}>
                            {w.phone_number || `Worker ID #${w.id}`}
                          </p>
                        </div>
                      </div>
                      <div className="shrink-0 ml-2">
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-black ${
                          isSelected ? 'bg-white text-blue-700' : 'border border-slate-300 text-slate-400'
                        }`}>
                          {isSelected ? '✓' : '+'}
                        </span>
                      </div>
                    </button>
                  );
                })}
              </div>

              {/* Attribution Status Banner */}
              <div className="pt-1">
                {selectedAttendantIds.length > 0 ? (
                  <div className="text-xs font-bold text-blue-900 bg-white p-3 rounded-2xl border border-blue-200 flex flex-col sm:flex-row sm:items-center justify-between gap-1 shadow-2xs">
                    <span className="flex items-center space-x-1.5">
                      <span>👥</span>
                      <span>
                        {selectedAttendantIds.length} Attendant{selectedAttendantIds.length > 1 ? 's' : ''} Assigned:
                        <span className="font-extrabold ml-1">
                          {workersList.filter(w => selectedAttendantIds.includes(w.id)).map(w => w.user.first_name || w.user.username).join(', ')}
                        </span>
                      </span>
                    </span>
                    <span className="text-blue-700 font-extrabold bg-blue-50 px-2 py-0.5 rounded-lg border border-blue-100">
                      {selectedAttendantIds.length === 1 ? 'Earns 100% of commission' : `Commission split ${Math.round(100 / selectedAttendantIds.length)}% each`}
                    </span>
                  </div>
                ) : (
                  <div className="text-xs font-bold text-amber-900 bg-amber-100/70 p-3 rounded-2xl border border-amber-300 flex items-center space-x-2">
                    <span className="text-base">⚠️</span>
                    <span>Please tap one or more workers above to assign them to this car wash.</span>
                  </div>
                )}
              </div>
            </div>

            <hr className="border-slate-100" />

            {/* Step 3: Services & Multi-Worker Allocation */}
            <div>
              <div className="flex items-center justify-between mb-3">
                <h3 className="text-base font-bold text-slate-900 flex items-center space-x-2">
                  <span className="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs">3</span>
                  <span>Select Services Performed</span>
                </h3>
                <span className="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">
                  Assigned workers automatically apply to all services
                </span>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-4">
                {servicesList.map(srv => {
                  const isSelected = !!selectedServices[srv.id];
                  return (
                    <div 
                      key={srv.id}
                      onClick={() => toggleService(srv)}
                      className={`p-3.5 rounded-2xl border cursor-pointer transition flex items-start justify-between ${
                        isSelected ? 'border-blue-500 bg-blue-50/50 shadow-xs' : 'border-slate-200 hover:border-slate-300 bg-white'
                      }`}
                    >
                      <div className="flex items-start space-x-3">
                        <input
                          type="checkbox"
                          checked={isSelected}
                          onChange={() => {}}
                          className="mt-1 h-4 w-4 text-blue-600 rounded border-slate-300"
                        />
                        <div>
                          <p className="font-bold text-sm text-slate-900">{srv.name}</p>
                          <p className="text-xs text-slate-500">
                            Comm: {srv.default_commission_type === 'PERCENTAGE' ? `${srv.default_commission_value}%` : `KSh ${srv.default_commission_value}`}
                          </p>
                        </div>
                      </div>
                      <span className="font-extrabold text-sm text-slate-900">KSh {srv.default_price}</span>
                    </div>
                  );
                })}
              </div>

              {/* Dynamic Assigned Multi-Worker Selectors */}
              {Object.keys(selectedServices).length > 0 && (
                <div className="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-4">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                    <h4 className="text-xs font-black text-slate-800 uppercase tracking-wider">
                      Assigned Employees per Service:
                    </h4>
                    <span className="text-[11px] font-bold text-blue-700 bg-blue-100 px-2.5 py-0.5 rounded-full">
                      Multiple employees can wash the same car (Commission is split evenly)
                    </span>
                  </div>

                  {Object.entries(selectedServices).map(([srvId, item]) => {
                    const assignedIds = item.workerIds || [];
                    const count = assignedIds.length;
                    let totalComm = 0;
                    if (item.default_comm_type === 'PERCENTAGE') {
                      totalComm = (Number(item.price) * Number(item.default_comm_value)) / 100;
                    } else {
                      totalComm = Number(item.default_comm_value);
                    }
                    const perWorkerComm = count > 0 ? (totalComm / count).toFixed(2) : 0;

                    return (
                      <div key={srvId} className="bg-white p-4 rounded-2xl border border-slate-200 space-y-2.5 shadow-xs">
                        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1 pb-2 border-b border-slate-100">
                          <div>
                            <span className="font-black text-sm text-slate-900">{item.name}</span>
                            <span className="text-xs text-slate-500 ml-2">(Price Charged: KSh {item.price})</span>

                  <span>Payment Collection Option</span>
                </h3>

                {/* Pay Now vs Pay Later Toggle */}
                <div className="inline-flex p-1 bg-slate-100 rounded-2xl border border-slate-200">
                  <button
                    type="button"
                    onClick={() => setPayLater(false)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition flex items-center space-x-1.5 ${
                      !payLater ? 'bg-white text-blue-900 shadow-xs' : 'text-slate-500 hover:text-slate-800'
                    }`}

                    <span>💳 Collect Payment Now</span>
                  </button>
                  <button
                    type="button"
                    onClick={() => setPayLater(true)}
                    className={`px-3 py-1.5 rounded-xl text-xs font-extrabold transition flex items-center space-x-1.5 ${
                      payLater ? 'bg-amber-500 text-white shadow-xs' : 'text-slate-500 hover:text-slate-800'
                    }`}

                    <span>⏳ Pay Later on Collection</span>
                  </button>

                <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl mb-4 space-y-1.5 text-xs text-amber-900">
                  <div className="flex items-center space-x-2">
                    <span className="text-base">⏳</span>
                    <span className="font-extrabold text-sm text-amber-950">Payment Deferred — Owner Will Pay When Collecting Car</span>
                  </div>
                  <p className="text-amber-800 leading-relaxed">
                    Vehicle will be recorded without asking for payment right now. Worker commissions will be credited, and the wash transaction will be flagged as <strong>UNPAID</strong>. You or the cashier can record the payment method (M-Pesa, Cash, Split) when the customer returns to collect the car.

                <>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
