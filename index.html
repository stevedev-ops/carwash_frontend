    // ==========================================
    // 10. STAFF & WORKERS ROSTER
    // ==========================================
    function WorkersManagement({ showToast, currentUser }) {
      const [viewTab, setViewTab] = useState('workers'); // 'workers' | 'users'
      const [statusFilter, setStatusFilter] = useState('all'); // 'all' | 'active' | 'inactive'
      const [workers, setWorkers] = useState([]);
      const [users, setUsers] = useState([]);
      
      const [newWorkerModal, setNewWorkerModal] = useState(false);
      const [newWorker, setNewWorker] = useState({
        first_name: '',
        last_name: '',
        phone_number: '',
        national_id: '',
        password: 'worker123'
      });

      const [editWorkerModal, setEditWorkerModal] = useState(false);
      const [editingWorker, setEditingWorker] = useState(null);

      const [newUserModal, setNewUserModal] = useState(false);
      const [newUser, setNewUser] = useState({
        username: '',
        first_name: '',
        last_name: '',
        phone_number: '',
        role: 'CASHIER',
        password: ''
      });

      const [editUserModal, setEditUserModal] = useState(false);
      const [editingUser, setEditingUser] = useState(null);

      const loadWorkers = () => {
        authFetch('/workers/')
          .then(res => res.json())
          .then(data => setWorkers(Array.isArray(data) ? data : data.results || []))
          .catch(() => showToast('Failed to load workers roster', 'error'));
      };

      const loadUsers = () => {
        authFetch('/users/')
          .then(res => res.json())
          .then(data => setUsers(Array.isArray(data) ? data : data.results || []))
          .catch(() => {});
      };

      useEffect(() => {
        loadWorkers();
        loadUsers();
      }, []);

      const handleRegisterWorker = async (e) => {
        e.preventDefault();
        try {
          const res = await authFetch('/workers/', {
            method: 'POST',
            body: JSON.stringify(newWorker)
          });
          if (res.ok) {
            showToast('Worker registered successfully!', 'success');
            setNewWorkerModal(false);
            setNewWorker({ first_name: '', last_name: '', phone_number: '', national_id: '', password: 'worker123' });
            loadWorkers();
            loadUsers();
          } else {
            const err = await res.json().catch(() => ({}));
            showToast(err.error || 'Failed to register worker', 'error');
          }
        } catch (e) {
          showToast('Error registering worker', 'error');
        }
      };

      const handleOpenEditWorker = (w) => {
        setEditingWorker({
          id: w.id,
          first_name: w.user.first_name || '',
          last_name: w.user.last_name || '',
          phone_number: w.mpesa_number || w.user.phone_number || '',
          national_id: w.national_id || '',
          emergency_contact: w.emergency_contact || '',
          is_active: w.is_active !== false,
          password: ''
        });
        setEditWorkerModal(true);
      };

      const handleUpdateWorker = async (e) => {
        e.preventDefault();
        if (!editingWorker) return;
        try {
          const payload = {
            first_name: editingWorker.first_name,
            last_name: editingWorker.last_name,
            phone_number: editingWorker.phone_number,
            mpesa_number: editingWorker.phone_number,
            national_id: editingWorker.national_id,
            emergency_contact: editingWorker.emergency_contact,
            is_active: editingWorker.is_active
          };
          if (editingWorker.password) {
            payload.password = editingWorker.password;
          }

          const res = await authFetch(`/workers/${editingWorker.id}/`, {
            method: 'PATCH',
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            showToast('Worker profile updated successfully!', 'success');
            setEditWorkerModal(false);
            setEditingWorker(null);
            loadWorkers();
            loadUsers();
          } else {
            const err = await res.json().catch(() => ({}));
            showToast(err.error || 'Failed to update worker', 'error');
          }
        } catch (err) {
          showToast('Network error updating worker', 'error');
        }
      };

      const handleDeleteWorker = async (w) => {
        const workerName = `${w.user.first_name || ''} ${w.user.last_name || ''}`.trim() || w.user.username;
        const confirmMsg = `Delete worker "${workerName}"?\n\n- If this worker has past wash assignments, commissions, or payouts, their account will be deactivated and removed from active bay shifts to preserve your business financial records.\n- If they have no records, they will be permanently deleted.`;
        if (!window.confirm(confirmMsg)) return;

        try {
          const res = await authFetch(`/workers/${w.id}/`, {
            method: 'DELETE'
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            showToast(data.message || `Worker "${workerName}" removed / deactivated successfully!`, 'success');
            loadWorkers();
            loadUsers();
          } else {
            showToast(data.error || 'Failed to delete worker', 'error');
          }
        } catch (err) {
          showToast('Network error deleting worker', 'error');
        }
      };

      const handleToggleWorkerStatus = async (w) => {
        const newStatus = !w.is_active;
        try {
          const res = await authFetch(`/workers/${w.id}/`, {
            method: 'PATCH',
            body: JSON.stringify({ is_active: newStatus })
          });
          if (res.ok) {
            showToast(`Worker "${w.user.first_name}" is now ${newStatus ? 'Active' : 'Deactivated'}`, 'info');
            loadWorkers();
            loadUsers();
          }
        } catch (err) {
          showToast('Failed to toggle worker status', 'error');
        }
      };

      // Person / User Handlers
      const handleDeleteUser = async (u) => {
        if (currentUser && currentUser.id === u.id) {
          showToast('You cannot delete your own logged-in admin account.', 'warning');
          return;
        }
        const name = `${u.first_name || ''} ${u.last_name || ''}`.trim() || u.username;
        const confirmMsg = `Delete user "${name}" (@${u.username})?\n\n- If this user has recorded car washes, approvals, or payments, their account will be deactivated to protect audit trails.\n- If no records exist, they will be deleted permanently.`;
        if (!window.confirm(confirmMsg)) return;

        try {
          const res = await authFetch(`/users/${u.id}/`, { method: 'DELETE' });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            showToast(data.message || `User "${name}" deleted / deactivated successfully!`, 'success');
            loadUsers();
            loadWorkers();
          } else {
            showToast(data.error || 'Failed to delete user', 'error');
          }
        } catch (err) {
          showToast('Error deleting user', 'error');
        }
      };

      const handleOpenEditUser = (u) => {
        setEditingUser({
          id: u.id,
          username: u.username,
          first_name: u.first_name || '',
          last_name: u.last_name || '',
          phone_number: u.phone_number || '',
          role: u.role || 'CASHIER',
          is_active: u.is_active !== false,
          password: ''
        });
        setEditUserModal(true);
      };

      const handleUpdateUser = async (e) => {
        e.preventDefault();
        if (!editingUser) return;
        try {
          const payload = {
            first_name: editingUser.first_name,
            last_name: editingUser.last_name,
            phone_number: editingUser.phone_number,
            role: editingUser.role,
            is_active: editingUser.is_active
          };
          if (editingUser.password) payload.password = editingUser.password;

          const res = await authFetch(`/users/${editingUser.id}/`, {
            method: 'PATCH',
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            showToast('User account updated successfully!', 'success');
            setEditUserModal(false);
            setEditingUser(null);
            loadUsers();
            loadWorkers();
          } else {
            const err = await res.json().catch(() => ({}));
            showToast(err.error || 'Failed to update user', 'error');
          }
        } catch (err) {
          showToast('Network error updating user', 'error');
        }
      };

      const handleCreateUser = async (e) => {
        e.preventDefault();
        try {
          const res = await authFetch('/users/', {
            method: 'POST',
            body: JSON.stringify(newUser)
          });
          if (res.ok) {
            showToast(`Account @${newUser.username} created successfully!`, 'success');
            setNewUserModal(false);
            setNewUser({ username: '', first_name: '', last_name: '', phone_number: '', role: 'CASHIER', password: '' });
            loadUsers();
            loadWorkers();
          } else {
            const err = await res.json().catch(() => ({}));
            showToast(err.error || 'Failed to create user account', 'error');
          }
        } catch (e) {
          showToast('Network error creating user', 'error');
        }
      };

      const filteredWorkers = workers.filter(w => {
        if (statusFilter === 'active') return w.is_active !== false;
        if (statusFilter === 'inactive') return w.is_active === false;
        return true;
      });

      const filteredUsers = users.filter(u => {
        if (statusFilter === 'active') return u.is_active !== false;
        if (statusFilter === 'inactive') return u.is_active === false;
        return true;
      });

      return (
        <div className="space-y-6">
          {/* Header */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">Staff & Personnel Roster</h1>
              <p className="text-sm text-slate-500">Manage car wash attendants, edit profile details, delete personnel, and manage system accounts</p>
            </div>
            <div className="flex items-center space-x-2">
              {viewTab === 'workers' ? (
                <button
                  onClick={() => setNewWorkerModal(true)}
                  className="bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-4 py-2.5 rounded-xl text-xs shadow-xs transition flex items-center space-x-1.5"
                >
                  <span>+</span>
                  <span>Register Worker</span>
                </button>
              ) : (
                <button
                  onClick={() => setNewUserModal(true)}
                  className="bg-purple-600 hover:bg-purple-700 text-white font-extrabold px-4 py-2.5 rounded-xl text-xs shadow-xs transition flex items-center space-x-1.5"
                >
                  <span>+</span>
                  <span>Add Staff Account</span>
                </button>
              )}
            </div>
          </div>

          {/* Navigation Sub-Tabs & Status Filter */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-3 rounded-2xl border border-slate-200 shadow-2xs">
            {/* View Tab Toggle */}
            <div className="flex bg-slate-100 p-1 rounded-xl text-xs font-extrabold">
              <button
                type="button"
                onClick={() => setViewTab('workers')}
                className={`px-4 py-2 rounded-lg transition flex items-center space-x-2 ${
                  viewTab === 'workers' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                <span>🚗</span>
                <span>Bay Attendants ({workers.length})</span>
              </button>
              <button
                type="button"
                onClick={() => setViewTab('users')}
                className={`px-4 py-2 rounded-lg transition flex items-center space-x-2 ${
                  viewTab === 'users' ? 'bg-white text-purple-700 shadow-xs' : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                <span>👥</span>
                <span>All Staff & Logins ({users.length})</span>
              </button>
            </div>

            {/* Status Filter Pills */}
            <div className="flex items-center space-x-1.5 text-xs font-bold">
              <button
                type="button"
                onClick={() => setStatusFilter('all')}
                className={`px-3 py-1.5 rounded-xl transition ${statusFilter === 'all' ? 'bg-slate-900 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
              >
                All
              </button>
              <button
                type="button"
                onClick={() => setStatusFilter('active')}
                className={`px-3 py-1.5 rounded-xl transition ${statusFilter === 'active' ? 'bg-emerald-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
              >
                Active
              </button>
              <button
                type="button"
                onClick={() => setStatusFilter('inactive')}
                className={`px-3 py-1.5 rounded-xl transition ${statusFilter === 'inactive' ? 'bg-slate-600 text-white' : 'text-slate-600 hover:bg-slate-100'}`}
              >
                Deactivated
              </button>
            </div>
          </div>

          {/* VIEW TAB 1: CAR WASH BAY ATTENDANTS */}
          {viewTab === 'workers' && (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
              {filteredWorkers.length === 0 ? (
                <div className="col-span-full bg-white p-12 text-center rounded-3xl border border-slate-200 text-slate-400">
                  <p className="text-3xl mb-2">🧑‍🔧</p>
                  <p className="font-bold text-sm">No car wash workers found in this view.</p>

    function ReportsModule({ showToast }) {
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [activeReportTab, setActiveReportTab] = useState('today_payouts');
      const [payoutsData, setPayoutsData] = useState(null);
      const [revenueData, setRevenueData] = useState(null);
      const [closingData, setClosingData] = useState(null);
      const [loading, setLoading] = useState(true);

      const loadAllReports = (dateVal = selectedDate) => {
        setLoading(true);
        Promise.all([
          authFetch(`/reports/today-payouts/?date=${dateVal}`).then(r => r.json()).catch(() => null),
          authFetch(`/reports/today-revenue/?date=${dateVal}`).then(r => r.json()).catch(() => null),
          authFetch(`/reports/shift-closing/?date=${dateVal}`).then(r => r.json()).catch(() => null)
        ]).then(([pData, rData, cData]) => {
          if (pData) setPayoutsData(pData);
          if (rData) setRevenueData(rData);
          if (cData) setClosingData(cData);
          setLoading(false);
        }).catch(() => setLoading(false));
      };

      useEffect(() => {
        loadAllReports(selectedDate);
      }, [selectedDate]);

      useEffect(() => {
        const handler = () => loadAllReports(selectedDate);
        window.addEventListener('shell_data_synced', handler);
        return () => window.removeEventListener('shell_data_synced', handler);
      }, [selectedDate]);

      const downloadFile = (url, name) => {
        const token = safeStore.getItem('cw_token') || '';
        let targetUrl = url;
        if (url.startsWith('/api') && API_BASE !== '/api') {
          targetUrl = `${API_BASE}${url.slice(4)}`;
        } else if (!url.startsWith('http') && !url.startsWith('/api')) {
          targetUrl = `${API_BASE}${url.startsWith('/') ? '' : '/'}${url}`;
        }
        const fullUrl = `${targetUrl}${targetUrl.includes('?') ? '&' : '?'}token=${token}`;
        window.open(fullUrl, '_blank');
        showToast(`Generating and downloading: ${name}...`, 'info');
      };

      const handleDownloadOfflineBackup = () => {
        const queue = offlineEngine.getQueue();
        const cachedWashes = offlineEngine.getCached('/washes/') || [];
        const cachedWorkers = offlineEngine.getCached('/workers/') || [];

        let csv = "SHELL CAR WASH - FULL LOCAL SYSTEM BACKUP (OFFLINE SNAPSHOT)\n";
        csv += `Export Timestamp,${new Date().toISOString()}\n`;
        csv += `Network Status,${navigator.onLine ? 'Online' : 'Offline'}\n`;
        csv += `Unsynced Offline Queue Items,${queue.length}\n\n`;

        csv += "--- TODAY WORKER PAYOUTS & BALANCES ---\n";
        csv += "Worker Name,Jobs Today,Earned Today (KSh),Paid Today (KSh),Needs To Be Paid (KSh)\n";
        (payoutsData?.workers || cachedWorkers).forEach(w => {
          csv += `"${w.name || w.user?.first_name || 'Worker'}","${w.jobs_count_today || 0}","${w.earned_today || 0}","${w.paid_today || 0}","${w.needs_to_be_paid || w.outstanding_balance || 0}"\n`;
        });

        csv += "\n--- CAR WASHES LEDGER ---\n";
        csv += "ID,Date,Plate,Vehicle Type,Services,Total Bill,Payment Method,Status\n";
        (revenueData?.washes || cachedWashes).forEach(w => {
          csv += `"${w.id}","${w.created_at || w.time || ''}","${w.plate_number || w.vehicle?.plate_number || ''}","${w.vehicle_type || ''}","${w.services || ''}","${w.total_amount || 0}","${w.payment_method || ''}","${w.status || 'COMPLETED'}"\n`;
        });

        if (closingData) {
          csv += "\n--- SHIFT CLOSING SUMMARY ---\n";
          csv += `Shift Date,${closingData.date}\n`;
          csv += `Total Cars,${closingData.total_cars_washed}\n`;
          csv += `Total Revenue,${closingData.total_revenue}\n`;
          csv += `Expected Cash,${closingData.expected_cash_in_drawer}\n`;
          csv += `Counted Cash,${closingData.actual_cash_counted}\n`;
          csv += `Variance,${closingData.cash_variance}\n`;
        }

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `shell_carwash_full_system_export_${selectedDate}.csv`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Local system snapshot downloaded successfully!', 'success');
      };

      return (

    // ==========================================
    // 13. SHELL CARWASH WORKER STATION PORTAL
    // ==========================================
    function WorkerPortal({ currentUser, selectedWorkerId, showToast, onLogout }) {
      const [workerTab, setWorkerTab] = useState('dashboard');
      const [summary, setSummary] = useState(null);
      const [jobs, setJobs] = useState([]);
      const [payouts, setPayouts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [workerSidebarOpen, setWorkerSidebarOpen] = useState(false);

      const [logModalOpen, setLogModalOpen] = useState(false);
      const [servicesList, setServicesList] = useState([]);
      const [allWorkers, setAllWorkers] = useState([]);
      const [selectedWorkerIds, setSelectedWorkerIds] = useState([]);
      const [logPlate, setLogPlate] = useState('');
      const [logVehicleType, setLogVehicleType] = useState('SEDAN');
      const [logServiceId, setLogServiceId] = useState('');
      const [logPaymentMethod, setLogPaymentMethod] = useState('MPESA');
      const [workerSkipPayment, setWorkerSkipPayment] = useState(true);
      const [logRef, setLogRef] = useState('');
      const [submittingJob, setSubmittingJob] = useState(false);

      const toggleWorkerSelection = (workerId) => {
        const wid = Number(workerId);
        setSelectedWorkerIds(prev =>
          prev.includes(wid) ? prev.filter(id => id !== wid) : [...prev, wid]
        );
      };

      const loadWorkerData = () => {
        setLoading(true);
        const query = selectedWorkerId ? `?worker_id=${selectedWorkerId}` : '';
        Promise.all([
          authFetch(`/worker-portal/summary/${query}`).then(r => r.json()),
          authFetch(`/worker-portal/jobs/${query}`).then(r => r.json()),
          authFetch(`/worker-portal/payouts/${query}`).then(r => r.json()),
          authFetch('/services/?active_only=true').then(r => r.json()),
          authFetch('/workers/?active_only=true').then(r => r.json())
        ]).then(([sData, jData, pData, srvData, wData]) => {
          setSummary(sData);
          setJobs(Array.isArray(jData) ? jData : []);
          setPayouts(Array.isArray(pData) ? pData : []);
          const srvs = Array.isArray(srvData) ? srvData : srvData.results || [];
          setServicesList(srvs);
          if (srvs.length > 0 && !logServiceId) setLogServiceId(srvs[0].id);
          const wrks = Array.isArray(wData) ? wData : wData.results || [];
          setAllWorkers(wrks);
          const myId = Number(sData?.worker_id || selectedWorkerId || wrks[0]?.id || 1);
          setSelectedWorkerIds(prev => (prev.length === 0 ? [myId] : prev));
          setLoading(false);
        }).catch(() => setLoading(false));
      };

      useEffect(() => { loadWorkerData(); }, [selectedWorkerId]);

      // Edge Swipe: Swiping right from left edge anywhere on screen opens worker sidebar drawer from anywhere
      useEffect(() => {
        let touchStartX = 0;
        let touchStartY = 0;

        const handleTouchStart = (e) => {
          if (e.touches && e.touches.length === 1) {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
          }
        };

        const handleTouchEnd = (e) => {
          if (!touchStartX) return;
          const touchEndX = e.changedTouches[0].clientX;
          const touchEndY = e.changedTouches[0].clientY;
          const diffX = touchEndX - touchStartX;
          const diffY = touchEndY - touchStartY;

          // If swiped right from anywhere near the left side of the screen (< 80px)
          if (diffX > 50 && Math.abs(diffX) > Math.abs(diffY) && touchStartX < 80) {
            setWorkerSidebarOpen(true);
          }
          // If drawer is open and swiped left, close it
          if (diffX < -50 && Math.abs(diffX) > Math.abs(diffY) && workerSidebarOpen) {
            setWorkerSidebarOpen(false);
          }
          touchStartX = 0;
          touchStartY = 0;
        };

        window.addEventListener('touchstart', handleTouchStart, { passive: true });
        window.addEventListener('touchend', handleTouchEnd, { passive: true });

        return () => {
          window.removeEventListener('touchstart', handleTouchStart);
          window.removeEventListener('touchend', handleTouchEnd);
        };
      }, [workerSidebarOpen]);

      const handleWorkerSubmitJob = async (e) => {
        e.preventDefault();
        if (!logPlate.trim()) {
          showToast('Enter vehicle plate', 'error');
          return;
        }

        const chosenSrv = servicesList.find(s => s.id === Number(logServiceId));
        if (!chosenSrv) return;

        if (selectedWorkerIds.length === 0) {
          showToast('Please select who did this work (at least one worker)', 'error');
          return;
        }

        const srvPrice = Number(chosenSrv.default_price || 0);
        const combinedWorkerIds = selectedWorkerIds.map(Number);

        setSubmittingJob(true);
        try {
          const payload = {
            plate_number: logPlate.toUpperCase().trim(),
            vehicle_type: logVehicleType,
            payment_method: workerSkipPayment ? 'UNPAID' : logPaymentMethod,
            cash_amount: workerSkipPayment ? 0 : (logPaymentMethod === 'CASH' ? srvPrice : logPaymentMethod === 'SPLIT' ? Math.floor(srvPrice / 2) : 0),
            mpesa_amount: workerSkipPayment ? 0 : (logPaymentMethod === 'MPESA' ? srvPrice : logPaymentMethod === 'SPLIT' ? Math.ceil(srvPrice / 2) : 0),
            payment_reference: workerSkipPayment ? '' : logRef,
            is_paid: !workerSkipPayment,
            notes: workerSkipPayment ? 'Bay worker skipped payment (Admin collects upon vehicle pickup)' : '',
            items: [
              {
                service_id: chosenSrv.id,

                      required
                      placeholder="e.g. KDF 992P"
                      value={logPlate}
                      onChange={e => setLogPlate(e.target.value)}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-extrabold uppercase tracking-wider text-sm focus:outline-none focus:ring-2 focus:ring-orange-500"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 uppercase mb-1">Vehicle Type</label>
                    <select
                      value={logVehicleType}
                      onChange={e => setLogVehicleType(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-semibold"
                    >
                      <option value="SEDAN">Saloon / Sedan</option>
                      <option value="SUV">SUV / 4x4</option>
                      <option value="VAN">Van / Pickup</option>
                      <option value="BODA">Motorbike / Boda</option>
                    </select>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 uppercase mb-1">Service Completed *</label>
                    <select
                      value={logServiceId}
                      onChange={e => setLogServiceId(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                    >
                      {servicesList.map(s => (
                        <option key={s.id} value={s.id}>{s.name} - KSh {s.default_price}</option>
                      ))}
                    </select>
                  </div>

                  {/* Multi-Employee Assignment: Select Workers Who Did This Work */}
                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2">
                    <div className="flex items-center justify-between">
                      <label className="font-extrabold text-slate-800 text-[11px] flex items-center space-x-1">
                        <span>👥</span>
                        <span>Who Did This Work? *</span>
                      </label>
                      <span className="text-[10px] font-bold text-orange-600 bg-orange-100 px-2 py-0.5 rounded-full">
                        {totalAssignedCount} Staff Selected
                      </span>
                    </div>

                    <div className="flex flex-wrap gap-1.5 pt-1">
                      {allWorkers.map(w => {
                        const isSelected = selectedWorkerIds.includes(w.id);
                        const isMe = w.id === myWorkerId;
                        const wName = w.user?.first_name ? `${w.user.first_name} ${w.user.last_name || ''}`.trim() : (w.user?.username || `Worker #${w.id}`);
                        return (
                          <button
                            key={w.id}
                            type="button"
                            onClick={() => toggleWorkerSelection(w.id)}
                            className={`inline-flex items-center space-x-1 px-2.5 py-1 rounded-xl text-[11px] font-bold transition border ${
                              isSelected
                                ? 'bg-orange-600 border-orange-600 text-white shadow-xs font-black'
                                : 'bg-white border-slate-300 text-slate-700 hover:border-orange-400'
                            }`}
                          >
                            <span>{isSelected ? '✓' : '+'}</span>
                            <span>{wName}{isMe ? ' (You)' : ''}</span>
                          </button>
                        );
                      })}
                    </div>

                    {/* Split preview badge */}
                    <div className="text-[10px] font-bold text-slate-600 bg-white p-2 rounded-xl border border-slate-200 flex items-center justify-between">
                      <span>Commission Split:</span>
                      <span className="text-orange-700 font-extrabold">
                        {totalAssignedCount === 1 
                          ? `You earn 100% (KSh ${baseComm})`
                          : `${totalAssignedCount} workers → Each earns KSh ${splitCommPreview} (Total KSh ${baseComm})`}
                      </span>
                    </div>
                  </div>

                  {/* Worker Skip Payment Toggle */}
                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="font-extrabold text-xs text-slate-800">Payment Entry:</span>
                      <button
                        type="button"
                        onClick={() => setWorkerSkipPayment(!workerSkipPayment)}
                        className={`px-3 py-1 rounded-xl text-xs font-extrabold transition flex items-center space-x-1 ${
                          workerSkipPayment ? 'bg-amber-500 text-white shadow-xs' : 'bg-slate-200 text-slate-700'
                        }`}
                      >
                        <span>{workerSkipPayment ? '⏳ Skip Payment (Collect Later)' : '💳 Enter Payment Now'}</span>
                      </button>
                    </div>

                    {workerSkipPayment ? (
                      <div className="text-[11px] text-amber-800 bg-amber-50 p-2.5 rounded-xl border border-amber-200 space-y-1">
                        <p className="font-bold flex items-center space-x-1">
                          <span>✓</span>
                          <span>Worker does not collect payment in bay</span>
                        </p>
                        <p className="text-amber-700">
                          Job will be recorded as <strong>UNPAID</strong>. Cashier / Admin collects the money when the customer collects the car.
                        </p>
                      </div>
                    ) : (
                      <p className="text-[11px] text-slate-500">
                        Customer is paying you directly right now. Enter the payment method and reference code below.
                      </p>
                    )}
                  </div>

                  {!workerSkipPayment && (
                    <>
                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Customer Paid Via</label>
                        <select
                          value={logPaymentMethod}
                          onChange={e => setLogPaymentMethod(e.target.value)}
                          className="w-full px-3 py-2 rounded-xl border border-slate-300 font-bold"
                        >
                          <option value="MPESA">M-Pesa</option>
                          <option value="CASH">Cash</option>
                          <option value="SPLIT">Split (Cash + M-Pesa)</option>
                          <option value="CARD">Card</option>
                        </select>
                      </div>

                      <div>
                        <label className="block font-bold text-slate-700 uppercase mb-1">Payment Reference (M-Pesa Code)</label>
                        <input
                          type="text"
                          placeholder="e.g. QWE123987"
                          value={logRef}
                          onChange={e => setLogRef(e.target.value)}
                          className="w-full px-3.5 py-2 rounded-xl border border-slate-300"
                        />
                      </div>
                    </>
                  )}

                  <div className="pt-2">
                    <button
                      type="submit"
                      disabled={submittingJob}
                      className={`w-full py-3 rounded-xl text-white font-extrabold shadow-md transition disabled:opacity-50 ${
                        workerSkipPayment ? 'bg-amber-600 hover:bg-amber-700' : 'bg-orange-600 hover:bg-orange-700'
                      }`}
                    >
                      {submittingJob
                        ? 'Submitting...'
                        : (workerSkipPayment ? '✓ Log Wash (Admin Collects Payment Later)' : 'Submit for Admin Approval')}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Quick Floating Menu Button for Worker (Always accessible anywhere on worker screen) */}
          <button
            type="button"
            onClick={() => setWorkerSidebarOpen(true)}
            className="fixed bottom-6 right-5 z-40 flex items-center space-x-2 bg-gradient-to-r from-orange-600 to-amber-600 text-white px-4 py-3 rounded-full shadow-2xl active:scale-95 transition-all hover:brightness-110 border border-white/20 backdrop-blur-md text-xs font-black"
            title="Open Sidebar Menu"
          >
            <span className="text-base">☰</span>
            <span className="tracking-wide uppercase">Menu</span>
          </button>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
